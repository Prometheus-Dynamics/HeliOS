title = "Shared frame scratch or arena contract"
owner = "Shared HeliOS/Daedalus"
status = "landed"
proof_reference = "lib-cv runtime scratch ownership is explicit in backend/src/libs/lib-cv/src/runtime_scratch.rs and surfaced live via /v1/device/runtime."

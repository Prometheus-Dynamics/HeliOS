# Copied unchanged (below this header) from Atlas-Hardware-Manager cbbaa6b devices/raze/gaia/assets/rootfs/usr/share/board/raze/camera.toml,
# the board's camera description (installed at /usr/share/board/raze/camera.toml). up.sh hands it to
# helios-api with SIM_BOARD_CAMERA_FILE, so an uncalibrated sim camera gets the Raze's lens hint.
# Generated by devices/tools/gen-raze.py from devices/raze/manifest.json; do not edit.
# Change the manifest and run the tool (CI runs it with --check).
schema_version = 1

[camera]
sensor = "ov9782"
port = "cam0"

[camera.lens]
model = "fisheye"
projection = "equidistant"

# One module's fit, a starting point for the self-calibration.
[camera.lens.hint]
width = 1280
height = 800
fx_px = 566.0
rms_px = 0.11

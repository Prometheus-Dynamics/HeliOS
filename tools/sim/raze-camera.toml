# Copied unchanged (below this header) from Atlas-Hardware-Manager 18a5f6a devices/raze/gaia/assets/rootfs/usr/share/board/raze/camera.toml,
# the board's camera description (installed at /usr/share/board/raze/camera.toml). up.sh hands it to
# helios-api with SIM_BOARD_CAMERA_FILE, so an uncalibrated sim camera gets the Raze's lens hint.
# Generated by devices/tools/gen-raze.py from devices/raze/manifest.json; do not edit.
# Change the manifest and run the tool (CI runs it with --check).
schema_version = 1

[camera]
sensor = "ov9782"
port = "cam0"

[camera.lens]
model = "fisheye"
projection = "equidistant"

# One module's fit: a prior the self-calibration starts from and is softly
# pulled toward (sigma: the focal length's relative spread across modules),
# not a calibration. Distortion: OpenCV cv::fisheye k1..k4 (equidistant).
[camera.lens.hint]
width = 1280
height = 800
fx_px = 566.508
fy_px = 565.375
cx_px = 627.29
cy_px = 351.807
rms_px = 0.11
sigma = 0.05

[camera.lens.hint.distortion]
k1 = -0.0156148
k2 = 0.0280815
k3 = -0.0133785
k4 = 0.00147003

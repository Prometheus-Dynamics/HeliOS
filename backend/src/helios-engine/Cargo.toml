[package]
name = "helios-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["runtime"]
dto = [
    "serde",
    "serde_json",
    "serde_bytes",
    "uuid",
    "chrono",
    "thiserror",
    "lib-ipc",
    "bincode",
    "styx",
    "tokio",
    "tracing",
]
runtime = [
    "dto",
    "clap",
    "tokio",
    "tracing",
    "tracing-subscriber",
    "metrics",
    "rayon",
    "tokio-util",
    "futures",
    "serde",
    "serde_json",
    "serde_bytes",
    "uuid",
    "chrono",
    "lib-ipc",
    "styx",
    "image",
    "bincode",
    "reqwest",
    "daedalus",
    "lib-cv",
    "nalgebra",
    "ffmpeg",
]
tokio-console = ["runtime", "dep:console-subscriber"]
pprof = ["runtime", "dep:pprof"]
perf-counters = ["runtime", "dep:libc"]
client-mock = ["runtime"]

[dependencies]
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
lib-ipc = { path = "../libs/lib-ipc", optional = true }
image = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
console-subscriber = { version = "0.1.10", optional = true }
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph", "prost-codec"], optional = true }
libc = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
utoipa.workspace = true
styx = { workspace = true, features = ["async", "hooks", "v4l2", "libcamera", "netcam", "netcam-video", "file-backend", "file-backend-video", "codec-ffmpeg", "serde", "schema"], optional = true }
smallvec = "1.13"
daedalus = { workspace = true, features = ["engine", "plugins", "gpu-wgpu", "ffi"], optional = true }
lib-cv = { path = "../libs/lib-cv", optional = true }
nalgebra = { workspace = true, optional = true }
ffmpeg = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.12.0"
async-trait = "0.1"
lib-test.workspace = true

[build-dependencies]
serde = { workspace = true, features = ["derive"] }

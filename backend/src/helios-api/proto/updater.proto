syntax = "proto3";

package helios.api.updater.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message Empty {}

message OperationAck {
  string command_id = 1;
}

message UpdateRequest {
  string update_id = 1;
}

message StageReleaseRequest {
  string update_id = 1;
  UrlArtifact manifest = 2;
}

message ApplyReleaseRequest {
  string update_id = 1;
  MaintenanceWindow window = 2;
}

message QueryStateResponse {
  UpdateState active_update = 1;
  uint64 cache_usage_bytes = 2;
}

message UpdateEvent {
  oneof event {
    StageProgressEvent stage_progress = 1;
    StageCompleteEvent stage_complete = 2;
    ApplyScheduledEvent apply_scheduled = 3;
    ApplyCompleteEvent apply_complete = 4;
    RollbackTriggeredEvent rollback_triggered = 5;
    StateSnapshotEvent state_snapshot = 6;
    HeartbeatEvent heartbeat = 7;
    LogRecordEvent log_record = 8;
  }
}

message StageProgressEvent {
  string update_id = 1;
  uint32 percent = 2;
  optional string detail = 3;
}

message StageCompleteEvent {
  string update_id = 1;
}

message ApplyScheduledEvent {
  string update_id = 1;
  google.protobuf.Timestamp eta = 2;
}

message ApplyCompleteEvent {
  string update_id = 1;
  bool reboot_required = 2;
}

message RollbackTriggeredEvent {
  string update_id = 1;
  string reason = 2;
}

message StateSnapshotEvent {
  UpdateState active_update = 1;
  uint64 cache_usage_bytes = 2;
}

message HeartbeatEvent {
  uint64 uptime_ms = 1;
  uint64 sequence = 2;
  uint32 stage_queue_depth = 3;
}

message LogRecordEvent {
  string level = 1;
  repeated string span = 2;
  string message = 3;
}

message MaintenanceWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Duration duration = 2;
}

message UrlArtifact {
  string url = 1;
  optional uint64 size_bytes = 2;
  optional string checksum = 3;
}

enum UpdateStage {
  UPDATE_STAGE_UNSPECIFIED = 0;
  UPDATE_STAGE_IDLE = 1;
  UPDATE_STAGE_DOWNLOADING = 2;
  UPDATE_STAGE_VERIFYING = 3;
  UPDATE_STAGE_AWAITING_WINDOW = 4;
  UPDATE_STAGE_APPLYING = 5;
  UPDATE_STAGE_REBOOTING = 6;
  UPDATE_STAGE_COMPLETE = 7;
  UPDATE_STAGE_ROLLED_BACK = 8;
}

message UpdateState {
  string update_id = 1;
  UpdateStage stage = 2;
  optional uint32 progress_percent = 3;
  optional string last_error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  repeated UrlArtifact artifacts = 7;
}

service Updater {
  rpc Stage(StageReleaseRequest) returns (OperationAck);
  rpc Apply(ApplyReleaseRequest) returns (OperationAck);
  rpc Cancel(UpdateRequest) returns (OperationAck);
  rpc Rollback(UpdateRequest) returns (OperationAck);
  rpc QueryState(Empty) returns (QueryStateResponse);
  rpc Subscribe(Empty) returns (stream UpdateEvent);
}

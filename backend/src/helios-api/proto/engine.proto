syntax = "proto3";

package helios.api.engine.v1;

message Empty {}

message EngineStatus {
  string status = 1;
}

message OperationAck {
  string command_id = 1;
}

message ListCamerasRequest {}

message CameraDescriptor {
  string camera_id = 1;
  string backend = 2;
  string display_name = 3;
}

message ListCamerasResponse {
  repeated CameraDescriptor devices = 1;
}

message StartSessionRequest {
  string stream_id = 1;
  string camera_id = 2;
}

message StopSessionRequest {
  string stream_id = 1;
}

message ListCameraControlsRequest {
  string camera_id = 1;
}

message ListCameraControlsResponse {
  string controls_json = 1;
}

message SetCameraControlRequest {
  string stream_id = 1;
  uint32 control_id = 2;
  string value_json = 3;
}

message AttachStreamOutputRequest {
  string stream_id = 1;
  repeated string codecs = 2;
}

message DetachStreamOutputRequest {
  string stream_id = 1;
}

message ListNodeRegistryResponse {
  repeated NodeDescriptor descriptors = 1;
}

message NodeDescriptor {
  string id = 1;
  string metadata_json = 2;
  string inputs_json = 3;
  string outputs_json = 4;
}

message PipelineGraphRequest {
  string pipeline_id = 1;
  bool inline_externals = 2;
}

message PipelineGraphResponse {
  string pipeline_id = 1;
  string graph_json = 2;
  string revision = 3;
}

message SavePipelineGraphRequest {
  string pipeline_id = 1;
  string graph_json = 2;
  optional string expected_revision = 3;
}

message PatchPipelineGraphRequest {
  string pipeline_id = 1;
  string expected_revision = 2;
  string patch_json = 3;
}

message DuplicatePipelineRequest {
  string source_pipeline_id = 1;
  string target_pipeline_id = 2;
}

service Engine {
  rpc GetStatus(Empty) returns (stream EngineStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc StartSession(StartSessionRequest) returns (OperationAck);
  rpc StopSession(StopSessionRequest) returns (OperationAck);
  rpc ListCameraControls(ListCameraControlsRequest) returns (ListCameraControlsResponse);
  rpc SetCameraControl(SetCameraControlRequest) returns (OperationAck);
  rpc AttachStreamOutput(AttachStreamOutputRequest) returns (OperationAck);
  rpc DetachStreamOutput(DetachStreamOutputRequest) returns (OperationAck);
  rpc ListNodeRegistry(Empty) returns (ListNodeRegistryResponse);
  rpc GetPipelineGraph(PipelineGraphRequest) returns (PipelineGraphResponse);
  rpc SavePipelineGraph(SavePipelineGraphRequest) returns (OperationAck);
  rpc PatchPipelineGraph(PatchPipelineGraphRequest) returns (OperationAck);
  rpc DuplicatePipeline(DuplicatePipelineRequest) returns (OperationAck);
}

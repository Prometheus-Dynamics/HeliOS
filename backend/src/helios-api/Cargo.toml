[package]
name = "helios-api"
version.workspace = true
edition = "2024"
publish = false
build = "build.rs"
default-run = "helios-api"

[lints]
workspace = true

[[bin]]
name = "helios-api"
path = "src/main.rs"

[[bin]]
name = "helios-api-tools"
path = "src/bin/helios-api-tools.rs"

[dependencies]
axum = { version = "0.8.8", features = ["http1", "macros", "ws", "multipart"] }
helios-engine = { path = "../helios-engine", default-features = false, features = ["dto"] }
helios-peripherals = { path = "../helios-peripherals", default-features = false, features = ["dto", "schema", "tracing"] }
helios-updater = { path = "../helios-updater", default-features = false, features = ["dto", "updater-ipc"] }
lib-asyncapi = { path = "../libs/lib-api/lib-asyncapi" }
lib-led-animations = { path = "../libs/lib-led-animations" }
lib-ipc = { path = "../libs/lib-ipc" }
lib-net = { path = "../libs/lib-net" }
lib-runtime-policy = { path = "../libs/lib-runtime-policy" }
lib-schema-migration = { path = "../libs/lib-schema-migration" }
lib-sensors = { path = "../libs/lib-sensors" }
chrono = { workspace = true }
url = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower-http = { version = "0.6.8", features = ["cors"] }
schemars = { workspace = true, features = ["uuid1"] }
sysinfo = { workspace = true }
prost = "0.14.3"
prost-types = "0.14.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
thiserror = "2.0.18"
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
utoipa.workspace = true
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tempfile = "3.27"
blake3 = "1.8"
nix = { version = "0.31", default-features = false, features = ["process", "term", "fs"] }
rustix = { version = "1.1.4", features = ["process", "termios"] }
toml = "1.1.2"
styx = { workspace = true, features = ["serde", "schema", "codec-turbojpeg"] }
mime_guess = "2.0.5"
image = { workspace = true }
imageproc = { workspace = true }
daedalus = { workspace = true, features = ["ffi"] }
lib-cv = { path = "../libs/lib-cv" }
lib-ai = { path = "../libs/lib-ai", default-features = false, features = ["engine", "backend-tflite", "backend-onnx", "backend-coral"] }
nalgebra = { workspace = true }
lopdf = "0.40.0"
flate2 = "1.1.9"
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }
reqwest.workspace = true
webpki-root-certs = "1.0.6"
nt_client = "0.5.1"
base64 = "0.22.1"
rmpv = "1.3.1"
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph", "prost-codec"], optional = true }

[features]
default = []
pprof = ["dep:pprof"]

[dev-dependencies]
helios-engine = { path = "../helios-engine", default-features = false, features = ["runtime"] }
tempfile = "3.27.0"
lib-test.workspace = true
tower = "0.5.3"

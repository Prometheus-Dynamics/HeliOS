syntax = "proto3";

package helios.engine.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// -----------------------------------------------------------------------------
// Shared engine primitives
// -----------------------------------------------------------------------------

message FeatureSet {
  repeated string features = 1;
}

message DeviceIdentity {
  optional string id = 1;
  optional string alias = 2;
  optional string hardware_id = 3;
}

message CalibrationVector {
  double x = 1;
  double y = 2;
  double z = 3;
}

message CalibrationRotation {
  double roll = 1;
  double pitch = 2;
  double yaw = 3;
}

message StreamCalibration {
  CalibrationVector translation = 1;
  CalibrationRotation rotation = 2;
}

message RobotDimensions {
  double width_m = 1;
  double length_m = 2;
  double bumper_height_m = 3;
  double bumper_thickness_m = 4;
  double ground_clearance_m = 5;
}

message RobotDimensionsPatch {
  optional double width_m = 1;
  optional double length_m = 2;
  optional double bumper_height_m = 3;
  optional double bumper_thickness_m = 4;
  optional double ground_clearance_m = 5;
}

message CaptureSettings {
  string backend = 1;
  map<string, google.protobuf.Value> options = 2;
}

message CodecSettings {
  string implementation = 1;
  string format = 2;
  bool prefer_hardware = 3;
  map<string, google.protobuf.Value> options = 4;
}

message GraphNodeOverrides {
  map<string, google.protobuf.Value> ports = 1;
}

message GraphBinding {
  string graph_id = 1;
  uint64 plan_hash = 2;
  uint32 priority = 3;
  map<string, GraphNodeOverrides> node_value_overrides = 4;
  optional string broken_reason = 5;
}

message StreamLayout {
  string mode = 1;
  StreamLayoutSource primary = 2;
}

message StreamLayoutSource {
  oneof kind {
    google.protobuf.Empty raw = 1;
    GraphSource graph = 2;
  }

  message GraphSource {
    string graph_id = 1;
    string output_key = 2;
  }
}

message StreamManifest {
  DeviceIdentity id = 1;
  string path = 2;
  CaptureSettings capture = 3;
  bool start_on_boot = 4;
  CodecSettings decoder = 6;
  CodecSettings encoder = 7;
  StreamLayout layout = 8;
  repeated GraphBinding graphs = 9;
  optional StreamCalibration calibration = 10;
}

message StreamOutputNegotiation {
  string stream_id = 1;
  string accepted_codec = 2;
  uint32 fd_index = 3;
}

message CaptureSessionProvisioned {
  string stream_id = 1;
  string path = 2;
  StreamManifest manifest = 3;
}

// -----------------------------------------------------------------------------
// Metrics snapshots
// -----------------------------------------------------------------------------

message ComponentMetricsSnapshot {
  double average_time_ms = 1;
  double average_fps = 2;
  uint32 sample_count = 3;
  uint32 window_size = 4;
  uint64 total_frame_time_ns = 5;
}

message StreamMetricsSnapshot {
  ComponentMetricsSnapshot backend = 1;
  ComponentMetricsSnapshot decoder = 2;
  ComponentMetricsSnapshot encoder = 3;
  uint64 input_failures = 4;
}

message CameraFormat {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  float fps = 4;
  map<string, google.protobuf.Value> metadata = 5;
}

message ControlInfo {
  uint32 id = 1;
  string name = 2;
  string kind = 3;
  google.protobuf.Value default_value = 4;
  google.protobuf.Value min = 5;
  google.protobuf.Value max = 6;
}

message Property {
  string name = 1;
  google.protobuf.Value value = 2;
}

// -----------------------------------------------------------------------------
// Camera inventory
// -----------------------------------------------------------------------------

message CameraInfo {
  string backend = 1;
  string path = 2;
  string hardware_id = 3;
  string display_name = 4;
  repeated CameraFormat formats = 5;
  repeated ControlInfo controls = 6;
  repeated Property properties = 7;
}

// -----------------------------------------------------------------------------
// Control-plane commands
// -----------------------------------------------------------------------------

message EngineCommand {
  string command_id = 1;

  oneof kind {
    HandshakeCommand handshake = 10;
    ListCamerasCommand list_cameras = 11;
    SubscribeSensorCommand subscribe_sensor = 15;
    UnsubscribeSensorCommand unsubscribe_sensor = 16;
    StreamOutputAttachCommand stream_output_attach = 17;
    StreamOutputDetachCommand stream_output_detach = 18;
    SetStreamLayoutCommand set_stream_layout = 34;
    StartSessionCommand start_session = 19;
    StopSessionCommand stop_session = 20;
    UpdateCapturePresetCommand update_capture_preset = 21;
    UpdateStreamCalibrationCommand update_stream_calibration = 22;
    GetCameraLayoutCommand get_camera_layout = 23;
    UpdateRobotDimensionsCommand update_robot_dimensions = 24;
    HeartbeatCommand heartbeat = 25;
    GetStreamMetricsCommand get_stream_metrics = 26;
    SetCameraControlCommand set_camera_control = 31;
  }
}

message HandshakeCommand {
  string client_name = 1;
  string client_version = 2;
  FeatureSet supported_features = 3;
}

message ListCamerasCommand {}

message SubscribeSensorCommand {
  string scope = 1;
}

message UnsubscribeSensorCommand {
  string scope = 1;
}

message StreamOutputAttachCommand {
  string stream_id = 1;
  repeated string codecs = 2;
}

message StreamOutputDetachCommand {
  string stream_id = 1;
}

message SetStreamLayoutCommand {
  string stream_id = 1;
  StreamLayout layout = 2;
}

message StartSessionCommand {
  string stream_id = 1;
  string path = 2;
  DeviceIdentity identity = 3;
}

message StopSessionCommand {
  string stream_id = 1;
}

message UpdateCapturePresetCommand {
  string stream_id = 1;
  CaptureSettings capture = 2;
  CodecSettings encoder = 3;
  CodecSettings decoder = 4;
}

message UpdateStreamCalibrationCommand {
  string stream_id = 1;
  optional StreamCalibration calibration = 2;
}

message GetCameraLayoutCommand {}

message UpdateRobotDimensionsCommand {
  RobotDimensionsPatch patch = 1;
}

message HeartbeatCommand {}

message GetStreamMetricsCommand {
  string stream_id = 1;
}

message SetCameraControlCommand {
  string stream_id = 1;
  uint32 control_id = 2;
  google.protobuf.Value value = 3;
}

// -----------------------------------------------------------------------------
// Control-plane events
// -----------------------------------------------------------------------------

message AckEvent {
  string command_id = 1;
  google.protobuf.Timestamp processed_at = 2;
}

message NackEvent {
  string command_id = 1;
  string reason = 2;
  bool retryable = 3;
}

message ControlEvent {
  oneof kind {
    AckEvent ack = 1;
    NackEvent nack = 2;
  }
}

message EngineEvent {
  oneof kind {
    AckEvent ack = 1;
    NackEvent nack = 2;
    CameraInventoryEvent camera_inventory = 3;
    StreamOutputNegotiation stream_output_negotiated = 7;
    FrameReadyEvent frame_ready = 8;
    CaptureSessionProvisioned capture_session_provisioned = 9;
    SensorSnapshotEvent sensor_snapshot = 10;
    SensorInventoryEvent sensor_inventory = 11;
    CameraLayoutEvent camera_layout = 12;
    HeartbeatEvent heartbeat = 13;
    MetricsEvent metrics = 14;
    StreamMetricsEvent stream_metrics = 15;
    ControlEvent control = 19;
    UnknownEvent unknown = 30;
  }
}

message CameraInventoryEvent {
  map<string, CameraList> devices = 1;

  message CameraList {
    repeated CameraInfo entries = 1;
  }
}

message FrameReadyEvent {
  string stream_id = 1;
  uint64 sequence = 2;
  string codec = 3;
  uint32 shm_slot = 4;
  uint32 fd_index = 5;
  optional bytes data = 6;
}

message SensorSnapshotEvent {
  string scope = 1;
  google.protobuf.Struct values = 2;
}

message SensorInventoryEvent {
  google.protobuf.Struct inventory = 1;
}

message CameraLayoutEvent {
  CameraLayoutSnapshot snapshot = 1;
}

message CameraLayoutSnapshot {
  RobotDimensions robot = 1;
  repeated CameraPose cameras = 2;
}

message CameraPose {
  string camera_uid = 1;
  string camera_id = 2;
  CalibrationVector translation = 3;
  CalibrationRotation rotation = 4;
  optional string updated_at = 5;
}

message HeartbeatEvent {
  uint64 uptime_ms = 1;
  uint32 backlog_depth = 2;
}

message MetricsEvent {
  uint64 interval_ms = 1;
  google.protobuf.Struct data = 2;
}

message StreamMetricsEvent {
  string stream_id = 1;
  StreamMetricsSnapshot metrics = 2;
}

message UnknownEvent {
  uint32 kind = 1;
  bytes payload = 2;
}

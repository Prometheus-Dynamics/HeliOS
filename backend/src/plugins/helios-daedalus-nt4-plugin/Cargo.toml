[package]
name = "helios-daedalus-nt4-plugin"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["plugins"]
plugins = []

[lints]
workspace = true

[dependencies]
daedalus = { workspace = true, features = ["ffi", "plugins", "gpu", "engine"] }
nt_client.workspace = true
rmpv.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
paste.workspace = true
lib-net = { path = "../../libs/lib-net" }
lib-schema-migration = { path = "../../libs/lib-schema-migration" }
lib-runtime-policy = { path = "../../libs/lib-runtime-policy" }

[dev-dependencies]
tempfile = "3.27.0"

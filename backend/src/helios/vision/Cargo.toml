[package]
name = "helios-vision"
version.workspace = true
edition.workspace = true
publish = false
description = "HeliOS vision nodes: Eidos marker detection as Daedalus graph stages"

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Export the plugin from the cdylib for the engine's dylib loader.
dylib = ["daedalus/dylib-plugins"]

[dependencies]
thiserror = { workspace = true }
daedalus = { workspace = true, features = ["plugins"] }
# `daedalus`: Styx registers its own frame types with Daedalus (StyxFramesPlugin).
styx = { workspace = true, default-features = false, features = ["daedalus"] }
eidos-aruco = { workspace = true, features = ["simd"] }
eidos-core = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
eidos-aruco = { workspace = true, features = ["simd", "neon"] }

[dev-dependencies]
daedalus = { workspace = true, features = ["engine", "plugins"] }

[package]
name = "helios-peripherals"
version.workspace = true
edition.workspace = true
autobins = false

[lib]
name = "helios_peripherals"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "helios-peripherals"
path = "src/main.rs"

[[bin]]
name = "peripherals_mem_probe"
path = "src/bin/peripherals_mem_probe.rs"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }

orion = { workspace = true, default-features = false, features = ["client"] }
lemnos = { workspace = true, default-features = false, features = ["builtin-drivers", "linux", "linux-hotplug", "tokio"] }
styx = { workspace = true, default-features = false, features = ["native", "v4l2", "raw-decoders", "serde", "hotplug", "async", "codec-turbojpeg"] }

[dev-dependencies]
tempfile = { workspace = true }

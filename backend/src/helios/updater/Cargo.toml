[package]
name = "helios-updater"
version.workspace = true
edition = "2024"

[features]
default = ["updater-ipc"]
dto = [
    "serde",
    "serde_json",
    "uuid",
    "chrono",
    "derive_more",
    "url",
    "tracing",
]
updater-ipc = [
    "dto",
    "tracing",
    "tokio",
    "tokio-util",
    "async-trait",
    "tracing-subscriber",
    "clap",
    "base64",
    "ed25519-dalek",
    "futures",
    "reqwest",
    "sha2",
    "hex",
    "bytes",
    "flate2",
    "webpki-root-certs",
]
mock = ["updater-ipc"]

[[bin]]
name = "helios-updater"
path = "src/main.rs"
required-features = ["updater-ipc"]

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
lib-schema-migration = { path = "../../libs/lib-schema-migration" }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
rkyv = { workspace = true }
toml = { workspace = true }
derive_more = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
url = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
webpki-root-certs = { workspace = true, optional = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
orion = { workspace = true, default-features = false, features = ["client", "control-plane", "core", "macros"] }

[dev-dependencies]

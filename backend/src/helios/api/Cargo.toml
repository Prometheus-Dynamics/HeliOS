[package]
name = "helios-api"
version.workspace = true
edition = "2024"
publish = false
build = "build.rs"
default-run = "helios-api"

[lints]
workspace = true

[lib]
name = "helios_api"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "helios-api"
path = "src/main.rs"
# No tests in the binary: `cargo test` does not build and link a test harness for it
# (`cargo clippy --all-targets` still checks it).
test = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
argon2 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
axum = { workspace = true, features = ["multipart", "ws"] }
futures-util = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The startup file (`startup.rs`).
toml = { workspace = true }

# Graph documents are validated with Daedalus's own parser (versioned `GraphDocument`).
daedalus-planner = { workspace = true, features = ["std"] }
# Graph values (a field layout's `known_tags` constant).
daedalus-data = { workspace = true }
# FRC field layouts (WPILib JSON, Limelight .fmap) as Eidos known tag poses.
helios-field = { path = "../field" }
# Where every path lives (the image or a guest prefix): `config.rs`.
helios-layout = { path = "../layout" }
helios-robot = { path = "../robot" }
# Session recordings of a camera (MCAP, `routes/recordings.rs`).
helios-recorder = { path = "../recorder" }
# Orion is the device's state store: resources, workloads, the updater and host facts.
orion = { workspace = true, default-features = false, features = ["client"] }
orion-client = { workspace = true }
# NetworkTables for recording control and status (`recording_nt.rs`): a second, low-rate client.
orion-nt4 = { workspace = true }
# Camera list, live camera metrics, controls and previews from the Styx camera services (no
# capture backends). `preview` + `codec-turbojpeg`: JPEG previews from YUV planes with
# libjpeg-turbo (Styx docs/preview.md).
styx = { workspace = true, default-features = false, features = ["facade", "metrics-serde", "preview", "codec-turbojpeg", "replay-mcap", "replay-mcap-lz4", "replay-softisp", "replay-png"] }
# Playback (`playback/`): a recording's metadata is read from its MCAP header, and a player's
# calibration and mount come from it.
mcap = { version = "0.25", default-features = false, features = ["lz4"] }

# lemnosd's LED client: the LED director's look and frame writes, and the ring's brightness.
lemnos-ipc = { workspace = true }

helios-diagnostics = { path = "../diagnostics" }
# Calibration on the device (`calibration_capture.rs`): ChArUco board detection and the
# intrinsics solve.
eidos-detectors = { workspace = true }
eidos-aruco = { workspace = true }
eidos-calibration = { workspace = true }
eidos-core = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }

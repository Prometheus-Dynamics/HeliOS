[package]
name = "helios-diagnostics"
version.workspace = true
edition = "2024"

[lib]
name = "helios_diagnostics"
path = "src/lib.rs"
# No doc tests: `cargo test` does not run rustdoc over the crate.
doctest = false

[[bin]]
name = "helios-diagnostics"
path = "src/main.rs"
# No tests in the binary: `cargo test` does not build and link a test harness for it
# (`cargo clippy --all-targets` still checks it).
test = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
glob = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

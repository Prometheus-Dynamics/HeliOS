[package]
name = "helios-vision-probe"
version.workspace = true
edition.workspace = true
publish = false
description = "Run a HeliOS vision graph document on a live camera through the Eidos plugin library and report detections and timings"

[lints]
workspace = true

[[bin]]
name = "helios-vision-probe"
path = "src/main.rs"

[dependencies]
daedalus = { workspace = true, features = ["engine", "dylib-plugins", "metrics"] }
styx = { workspace = true, default-features = false, features = ["native", "v4l2", "raw-decoders", "daedalus"] }
serde_json = { workspace = true }

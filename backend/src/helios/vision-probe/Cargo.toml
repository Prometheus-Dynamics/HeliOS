[package]
name = "helios-vision-probe"
version.workspace = true
edition.workspace = true
publish = false
description = "Run a HeliOS vision graph on a live camera and report detections and timings"

[lints]
workspace = true

[[bin]]
name = "helios-vision-probe"
path = "src/main.rs"

[dependencies]
helios-vision = { path = "../vision" }
daedalus = { workspace = true, features = ["engine", "plugins"] }
styx = { workspace = true, default-features = false, features = ["framelease", "native", "v4l2", "libcamera-vendor-rpi"] }
serde_json = { workspace = true }

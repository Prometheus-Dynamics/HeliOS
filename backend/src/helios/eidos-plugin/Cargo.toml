[package]
name = "helios-eidos-plugin"
version.workspace = true
edition.workspace = true
publish = false
description = "Eidos's Daedalus plugin (eidos_daedalus::EidosPlugin) as the native plugin library HeliOS installs"

[lints]
workspace = true

# A leaf `cdylib` with the one `export_plugin!` line, as Daedalus's
# `docs/dynamic-plugins.md` asks: the plugin itself (nodes, types, templates)
# is Eidos's `eidos-daedalus`. Build it in the same cargo build as
# helios-engine, so its Rust types (`FrameLease`, the Eidos hand-off types)
# are the engine's and it installs through the Rust-ABI path.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
daedalus = { workspace = true, features = ["dylib-plugins"] }
eidos-daedalus = { workspace = true, features = ["dylib", "simd"] }
styx = { workspace = true, default-features = false, features = ["daedalus"] }

# `gpu`: Eidos's GPU nodes (dense.map's sweep with `backend: gpu`) on Daedalus's wgpu backend, on
# the targets with a usable GPU (the CM5's V3D, Rockchip's Mali, desktops); riscv64 and armv7 build
# CPU-only. The engine opens the device only for a graph that asks for it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
eidos-daedalus = { workspace = true, features = ["dylib", "simd", "neon", "gpu"] }

# The x86 kernels for the simulator and host tools (tools/sim): without them Eidos runs its
# portable paths, several times slower than on a board.
[target.'cfg(target_arch = "x86_64")'.dependencies]
eidos-daedalus = { workspace = true, features = ["dylib", "simd", "x86", "gpu"] }

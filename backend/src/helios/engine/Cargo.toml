[package]
name = "helios-engine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
# No doc tests: `cargo test` does not run rustdoc over the crate.
doctest = false

[[bin]]
name = "helios-engine"
path = "src/main.rs"
# No tests in the binary: `cargo test` does not build and link a test harness for it
# (`cargo clippy --all-targets` still checks it).
test = false

[features]
default = ["plugins"]
plugins = []
# Simulated cameras (Styx's `sim`): the x86 sim (`tools/sim/up.sh`) serves them next to, or
# instead of, real ones, selected by STYX_SIM_CAMERAS. Off on the board.
sim = ["styx/sim"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# Where every path lives (the image or a guest prefix): `config.rs`.
helios-layout = { path = "../layout" }
helios-shutdown = { path = "../shutdown" }
helios-maps = { path = "../maps" }
helios-robot = { path = "../robot" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_ignored.workspace = true
notify = { workspace = true }
orion = { workspace = true, default-features = false, features = ["client", "macros", "transport-ipc"] }
# Pipeline outputs on NetworkTables for robot code (`nt4.rs`).
orion-nt4 = { workspace = true }
# Camera calibration for helios-api (`calibration.rs`): the ChArUco board and the lens fit, so
# the API has no Eidos of its own.
helios-calibration-wire = { path = "../calibration-wire" }
eidos-aruco = { workspace = true }
eidos-calibration = { workspace = true }
eidos-core = { workspace = true, features = ["std"] }
eidos-detectors = { workspace = true }
# `engine` (serial executor, no worker pool: graphs run on their driver thread),
# `dylib-plugins` (plugin libraries) and `metrics` (per-node/per-edge telemetry,
# off unless `HELIOS_ENGINE_METRICS_LEVEL` turns it on).
daedalus = { workspace = true, features = ["engine", "dylib-plugins", "metrics"] }
# `facade` provides `styx::ipc::FrameClient`; the capture backends serve the cameras
# (`cameras/`): native CSI sensors, V4L2 (with Rust raw decoders and libjpeg-turbo for USB
# cameras), device hotplug, and Styx's logs through `tracing`.
styx = { workspace = true, default-features = false, features = ["facade", "daedalus", "native", "v4l2", "raw-decoders", "hotplug", "tracing"] }
# One camera service per attached camera, started and stopped as cameras come and go (`cameras/`).
styx-camerad = { workspace = true, default-features = false, features = ["native", "v4l2", "turbojpeg"] }
# `poll(2)`: a graph thread waits on its cameras and its graph's inbound fd in one call.
nix = { workspace = true, features = ["poll"] }
# `sched_setaffinity(2)`: a graph thread is pinned to its workload's CPU core (`execution::affinity`).
libc = { workspace = true }
# The robot-frame camera mount as Eidos extrinsics (camera context).
helios-field = { path = "../field" }
# Eidos's camera calibration and extrinsics types, which the engine pushes into the graphs'
# held `camera` and `extrinsics` inputs (a Daedalus host can push only Rust-typed values). The
# same crate and features the plugin library is built with, in the same cargo build.
eidos-daedalus = { workspace = true, features = ["dylib", "simd"] }

# `gpu`: Eidos's GPU nodes (dense.map's sweep with `backend: gpu`) on Daedalus's wgpu backend, on
# the targets with a usable GPU (the CM5's V3D, Rockchip's Mali, desktops); riscv64 and armv7 build
# CPU-only. The engine opens the device only for a graph that asks for it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
eidos-daedalus = { workspace = true, features = ["dylib", "simd", "neon", "gpu"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
eidos-daedalus = { workspace = true, features = ["dylib", "simd", "x86", "gpu"] }

[dev-dependencies]
# The tests build Eidos known tag poses from layouts (`FieldLayout::known_tags`).
helios-field = { path = "../field", features = ["eidos"] }
tempfile = { workspace = true }
# Playback e2e: the test writes a recording (StreamRecorder) and replays it as a camera.
styx = { workspace = true, default-features = false, features = ["facade", "daedalus", "replay-mcap", "replay-mcap-lz4"] }
# Built by `cargo test` before the engine's tests, in the same build, so the tests can load
# `libhelios_eidos_plugin.so` through the engine's plugin loader.
helios-eidos-plugin = { path = "../eidos-plugin" }

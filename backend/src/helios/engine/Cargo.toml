[package]
name = "helios-engine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
# No doc tests: `cargo test` does not run rustdoc over the crate.
doctest = false

[[bin]]
name = "helios-engine"
path = "src/main.rs"
# No tests in the binary: `cargo test` does not build and link a test harness for it
# (`cargo clippy --all-targets` still checks it).
test = false

[features]
default = ["plugins"]
plugins = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Used by Daedalus's `declare_plugin!` expansion.
paste = { workspace = true }
notify = { workspace = true }
orion = { workspace = true, default-features = false, features = ["client", "macros", "transport-ipc"] }
# `engine` (serial executor, no worker pool: graphs run on their driver thread),
# `dylib-plugins` (plugin libraries) and `metrics` (per-node/per-edge telemetry,
# off unless `HELIOS_ENGINE_METRICS_LEVEL` turns it on).
daedalus = { workspace = true, features = ["engine", "dylib-plugins", "metrics"] }
# `facade` provides `styx::ipc::FrameClient`; no capture backends are needed.
styx = { workspace = true, default-features = false, features = ["facade", "daedalus"] }
# `poll(2)`: a graph thread waits on its cameras and its graph's inbound fd in one call.
nix = { workspace = true, features = ["poll"] }
# The robot-frame camera mount as Eidos extrinsics (camera context).
helios-field = { path = "../field" }
# Eidos's camera calibration and extrinsics types, which the engine pushes into the graphs'
# held `camera` and `extrinsics` inputs (a Daedalus host can push only Rust-typed values). The
# same crate and features the plugin library is built with, in the same cargo build.
eidos-daedalus = { workspace = true, features = ["dylib", "simd"] }

[dev-dependencies]
tempfile = { workspace = true }
# Marker bit patterns for synthetic test scenes.
eidos-aruco = { workspace = true }
# Built by `cargo test` before the engine's tests, in the same build, so the tests can load
# `libhelios_eidos_plugin.so` through the engine's plugin loader.
helios-eidos-plugin = { path = "../eidos-plugin" }

[package.metadata.cargo-machete]
# `declare_plugin!` expands to `paste::paste!`.
ignored = ["paste"]

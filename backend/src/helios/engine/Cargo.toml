[package]
name = "helios-engine"
version.workspace = true
edition.workspace = true

[features]
default = ["plugins"]
plugins = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
paste = { workspace = true }
memmap2 = { workspace = true }
notify = { workspace = true }
orion = { workspace = true, default-features = false, features = ["client", "control-plane", "core", "macros", "transport-ipc"] }
daedalus = { workspace = true, features = ["engine", "ffi", "plugins", "gpu"] }
styx = { workspace = true, default-features = false, features = ["framelease"] }

[dev-dependencies]
tempfile = { workspace = true }

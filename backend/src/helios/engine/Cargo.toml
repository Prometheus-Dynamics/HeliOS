[package]
name = "helios-engine"
version.workspace = true
edition.workspace = true

[features]
default = ["plugins"]
plugins = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
paste = { workspace = true }
memmap2 = { workspace = true }
notify = { workspace = true }
orion = { workspace = true, default-features = false, features = ["client", "macros", "transport-ipc"] }
daedalus = { workspace = true, features = ["engine", "dylib-plugins"] }
# `facade` provides `styx::ipc::FrameClient`; no capture backends are needed.
styx = { workspace = true, default-features = false, features = ["facade", "daedalus"] }

[dev-dependencies]
tempfile = { workspace = true }
helios-vision = { path = "../vision" }

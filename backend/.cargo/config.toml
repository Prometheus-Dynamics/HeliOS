[alias]
format = "fmt --all"
clippy-all = "clippy --workspace --all-targets -- -D warnings"

[build]
target-dir = "../target"

[env]
RUSTC_WRAPPER = "sccache"
SCCACHE_CACHE_SIZE = "20G"

[net]
git-fetch-with-cli = true

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    # Cross builds skip ffmpeg-sys-next feature probing, but ffmpeg-next relies on these cfgs
    # to keep matches exhaustive when the headers add new enum variants.
    "--cfg", "feature=\"ffmpeg_3_0\"",
    "--cfg", "feature=\"ffmpeg_3_1\"",
    "--cfg", "feature=\"ffmpeg_3_2\"",
    "--cfg", "feature=\"ffmpeg_3_3\"",
    "--cfg", "feature=\"ffmpeg_4_0\"",
    "--cfg", "feature=\"ffmpeg_4_1\"",
    "--cfg", "feature=\"ffmpeg_4_2\"",
    "--cfg", "feature=\"ffmpeg_4_3\"",
    "--cfg", "feature=\"ffmpeg_4_4\"",
    "--cfg", "feature=\"ffmpeg_5_0\"",
    "--cfg", "feature=\"ffmpeg_5_1\"",
    "--cfg", "feature=\"ffmpeg_6_0\"",
    "--cfg", "feature=\"ffmpeg_6_1\"",
    "--cfg", "feature=\"ffmpeg_7_0\"",
    "--cfg", "feature=\"ffmpeg_7_1\"",
    "--cfg", "feature=\"ffmpeg_8_0\"",
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"

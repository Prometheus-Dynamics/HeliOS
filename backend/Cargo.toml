[workspace.lints.rust]
unsafe_code = "warn"
# unused = "allow"

[workspace]
resolver = "3"
members = [
    "src/libs/lib-ai",
    "src/libs/lib-api/lib-api-macro",
    "src/libs/lib-api/lib-asyncapi",
    "src/libs/lib-api/lib-asyncapi-macro",
    "src/libs/lib-api/lib-ws",
    "src/libs/lib-api/lib-ws-macro",
    "src/libs/lib-api/lib-nt4",
    "src/libs/lib-api/lib-nt4-macro",
    "src/libs/lib-api/lib-transport",
    "src/libs/lib-lighting",
    "src/libs/lib-led-animations",
    "src/libs/lib-led-plugin",
    "src/libs/lib-nt4-plugin",
    "src/libs/lib-net",
    "src/libs/lib-math",
    "src/libs/lib-schema-migration",
    "src/libs/lib-sensors",
    "src/libs/lib-runtime-policy",
    "src/libs/lib-storage-layout",
    "src/libs/lib-test",
    "src/libs/lib-test-macro",
    "src/libs/lib-cv",
    "src/libs/lib-ipc",
    "src/plugins/helios-daedalus-cv-plugin",
    "src/plugins/helios-daedalus-ai-plugin",
    "src/plugins/helios-daedalus-nt4-plugin",
    "src/plugins/helios-daedalus-led-plugin",
    "src/helios-api",
    "src/helios-engine",
    "src/helios-peripherals",
    "src/helios-updater",
    "src/helios-usb-recoveryd",
    "src/helios-boot-buttond",
    "src/helios-diagnostics",
    "tools/dev-sim",
    "tools/xtask",
    "tools/heliosctl",
    "tools/helios-usbctl",
    "tools/helios-provision",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
tracing = "0.1.44"
tracing-appender = "0.2.4"
serde_json="1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
derive_more = {version = "2.1.1", features = ["from", "display", "error"] } 
thiserror = "2.0.18"
bincode = { version = "2.0.1", features = ["serde", "derive"] }
tracing-subscriber = {version = "0.3.22", features = ["json","fmt", "env-filter", "registry"] }
extern-v4l2 = {version = "0.14.0", features = ["v4l2"], package = "v4l"}
extern-libcamera = { package = "libcamera", version = "0.6.0", features = ["vendor_draft"] }
image = { version = "0.25.9", features = ["serde"] }
imageproc = {version = "0.26.1", features = ["rayon"]}
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
rayon = "1.11.0"
bytemuck = "1.25.0"
ffmpeg = {version= "8.0.0", package = "ffmpeg-next"}
uuid = {version = "1.22.0", features = ["v4", "v5", "serde"]}
futures = "0.3.32"
futures-util = "0.3.32"
async-trait = "0.1.89"
nt_client = { version = "0.5.1", features = ["publish_bypass"] }
rmpv = "1.3.1"
regex = "1.12.3"
bitflags = { version = "2.11.0", features = ["serde"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "rustls", "stream"] }
multipart-stream = "0.1.2"
mime = "0.3.17"
glob = "0.3.3"
utoipa = { version = "5.4.0", features = ["actix_extras", "macros", "uuid", "chrono"] }

utoipa-actix-web = "0.1.2"
dotenv = "0.15.0"
sysinfo = { version = "0.38.3", features = ["component"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tokio-stream = "0.1.18"
url = { version = "2.5.8", features = ["serde"] }
schemars = { version = "1.2.1", features = ["derive"] }
bitvec = "1.0.1"
once_cell = "1.21.3"
serde_bytes = "0.11.19"
toml = "1.0.6"
syn = { version = "2.0.117", features = ["full"] }
nalgebra = "0.34.1"
quote = "1.0.45"
proc-macro2 = "1.0.106"
paste = "1.0.15"
anyhow = "1.0.102"
libc = "0.2.183"
clap = { version = "4.5.60", features = ["derive", "env"] }
actix-web = "4.13.0"
actix-web-actors = "4.3.1"
actix = "0.13.5"
styx = { git = "https://github.com/Prometheus-Dynamics/Styx.git", rev = "ecd4b958cd86155acc81f23254fdc4a31fc3e7a1", default-features = false }
daedalus = { package = "daedalus-rs", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "910b6b83ce82fef75a4789750e7a85401f2864dc" }
daedalus-data = { package = "daedalus-data", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "910b6b83ce82fef75a4789750e7a85401f2864dc" }
daedalus-macros = { package = "daedalus-macros", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "910b6b83ce82fef75a4789750e7a85401f2864dc" }
geo = { version = "0.32.0", default-features = false }
linux-embedded-hal = "0.4.1"
rand = "0.10.0"
bytes = "1.11.1"
sd-notify = "0.4.5"
sha2 = "0.10.9"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
hex = "0.4.3"
metrics = "0.24.3"
lib-test = { path = "src/libs/lib-test" }
heck = "0.5.0"

[profile.release]
opt-level = 3  # Maximum optimization level (default for release)
lto = true
codegen-units = 1
# Keep symbol information for actionable on-device crash reports, but drop
# DWARF debug payloads from production artifacts.
debug = 1
strip = "debuginfo"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true

# Faster local iteration profile: keeps release-like behavior while avoiding
# expensive full LTO during the final link step.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[patch.crates-io]
libcamera = { path = "vendor/libcamera" }
                                       

[workspace.lints.rust]
unsafe_code = "warn"
# unused = "allow"

[workspace]
resolver = "3"
exclude = [
    # Retained source-only reference code. This is not part of the active
    # workspace, product build, or shipped image.
    "src/libs/lib-ai",
]
members = [
    "src/libs/lib-schema-migration",
    "src/helios/api",
    "src/helios/engine",
    "src/helios/peripherals",
    "src/helios/diagnostics",
    "src/helios/eidos-plugin",
    "src/helios/field",
    "src/helios/vision-probe",
    "tools/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
# Core
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
derive_more = { version = "2.1.1", features = ["from", "display", "error"] }
futures = "0.3.34"
futures-util = "0.3.34"
once_cell = "1.21.4"
rkyv = { version = "0.8.18", features = ["uuid-1", "little_endian", "pointer_width_64"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt", "env-filter", "registry"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "v5", "serde"] }

# Data and formats
base64 = "0.23.1"
bytes = "1.12.1"
glob = "0.3.4"
hex = "0.4.3"
rmpv = "1.3.1"
toml = "1.1.6"

# Networking and system
default-net = "0.22.0"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
get_if_addrs = "0.5.3"
hostname = { version = "0.4.2", features = ["set"] }
libc = "0.2.190"
mdns-sd = "0.21.5"
netlink-packet-route = "0.33.0"
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
notify = "8.2.0"
nt_client = { version = "0.5.1", features = ["publish_bypass"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream"] }
rtnetlink = "0.23.0"
sha2 = "0.11.0"
# Device security in helios-api: argon2id password hashes, OS randomness, constant-time compares.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.4.3"
subtle = "2.6.1"
webpki-root-certs = "1.0.9"

# Math and geometry
bytemuck = "1.25.2"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
geo = { version = "0.33.1", default-features = false }
libblur = { version = "0.24.0", features = ["image"] }
nalgebra = "0.35.0"
num = "0.4.3"
rand = "0.10.3"
rayon = "1.12.0"
wide = "1.7.1"

# Media and CV
ab_glyph = "0.2.32"
ffmpeg = { version = "9.0.0", package = "ffmpeg-next" }
image = { version = "0.25.10", features = ["serde"] }
imageproc = { version = "0.27.0", features = ["rayon"] }
memchr = "2.8.3"
memmap2 = "0.9.11"
smallvec = "1.16.2"

# Web and API
axum = { version = "0.8.9", features = ["http1"] }
utoipa = { version = "6.0.0", features = ["actix_extras", "macros", "uuid", "chrono"] }

# Build and dynamic libraries
libloading = "0.9.0"

# ML and inference
rusb = "0.9.4"
tract-core = "0.23.8"
tract-onnx = "0.23.8"
tract-tflite = "0.23.8"

# Testing and archives
criterion = { version = "0.8.2", features = ["html_reports"] }
flate2 = "1.1.10"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
tar = "0.4.46"
tempfile = "3.27.0"

# External repos
# Declared exactly as Styx and Eidos declare them (git + branch): Cargo treats
# `branch`, `tag` and `rev` as different sources, and two copies of Daedalus
# or Styx would mean two FrameLease and Payload types. The exact commits are
# pinned by Cargo.lock (`cargo update -p <crate>` moves them):
#   Daedalus 3.0 dev (66659f7, plugin ABI 9), Styx dev (40069d0), Eidos main (52d0c9e60),
#   Orion v4 main (973ced7; also the Gaia `orion` source), Lemnos dev (cca50f7; also the Gaia `lemnos` source).
# The engine and the plugin libraries must come from the same Daedalus commit: the image builds
# them in one cargo invocation (Gaia build_group "helios-backend").
# Updating another library tends to move Daedalus to its dev head: re-pin it with
# `cargo update -p daedalus-rs --precise 66659f7`, and check `cargo tree -d`.
daedalus = { package = "daedalus-rs", version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-data = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-macros = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-planner = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev", default-features = false }
# lemnosd's client (devices, controls, LED intents, raw GPIO/PWM/I2C/SPI) for helios-peripherals;
# it re-exports the compact-model and raw-access types it carries. HeliOS runs no in-process
# Lemnos runtime. `lemnosd` (feature `mock`) is a test dependency only: the real service over mock
# hardware.
lemnos-ipc = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev" }
lemnosd = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", default-features = false }
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", branch = "main", default-features = false }
styx = { version = "2.0.0", git = "https://github.com/Prometheus-Dynamics/Styx.git", branch = "dev", default-features = false }
eidos-aruco = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }
eidos-calibration = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false, features = ["std"] }
eidos-core = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }
eidos-daedalus = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Services are built for size; per-frame vision code is built for speed. Both
# levels matter under fat LTO: each crate's own (Eidos at "z" made the ArUco
# graph 4x slower) and the final artifact's (the engine and probe run the
# graph; the Eidos plugin library links the stages).
[profile.release.package.helios-eidos-plugin]
opt-level = 3

[profile.release.package.helios-engine]
opt-level = 3

[profile.release.package.helios-vision-probe]
opt-level = 3

# Eidos (per-frame CV) is built for speed too.
[profile.release.package.eidos-daedalus]
opt-level = 3

[profile.release.package.eidos-aruco]
opt-level = 3

[profile.release.package.eidos-calibration]
opt-level = 3

[profile.release.package.eidos-color]
opt-level = 3

[profile.release.package.eidos-contour]
opt-level = 3

[profile.release.package.eidos-core]
opt-level = 3

[profile.release.package.eidos-detectors]
opt-level = 3

[profile.release.package.eidos-draw]
opt-level = 3

[profile.release.package.eidos-filter]
opt-level = 3

[profile.release.package.eidos-frame]
opt-level = 3

[profile.release.package.eidos-geometry]
opt-level = 3

[profile.release.package.eidos-mask]
opt-level = 3

[profile.release.package.eidos-motion]
opt-level = 3

[profile.release.package.eidos-sampling]
opt-level = 3

[profile.release.package.eidos-scratch]
opt-level = 3

# Debug builds and tests (the gates). Line tables only: backtraces and panics keep file and
# line, without full variable and type debug info, which is most of what the compiler writes
# and the linker reads for every test binary. Use `--config profile.dev.debug=true` (or a
# local override) to step through with a debugger.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Faster local iteration profile: keeps release-like behavior while avoiding
# expensive full LTO during the final link step.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
                                       

[workspace.lints.rust]
unsafe_code = "warn"
# unused = "allow"

[workspace]
resolver = "3"
exclude = [
    # Retained source-only reference code. This is not part of the active
    # workspace, product build, or shipped image.
    "src/libs/lib-ai",
]
members = [
    "src/libs/lib-schema-migration",
    "src/helios/api",
    "src/helios/engine",
    "src/helios/peripherals",
    "src/helios/updater",
    "src/helios/diagnostics",
    "src/helios/ctl",
    "src/helios/eidos-plugin",
    "src/helios/vision-probe",
    "src/helios/provision",
    "tools/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
# Core
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
derive_more = { version = "2.1.1", features = ["from", "display", "error"] }
futures = "0.3.32"
futures-util = "0.3.32"
once_cell = "1.21.4"
paste = "1.0.15"
rkyv = { version = "0.8.15", features = ["uuid-1", "little_endian", "pointer_width_64"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt", "env-filter", "registry"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4", "v5", "serde"] }

# Data and formats
base64 = "0.22.1"
bytes = "1.11.1"
glob = "0.3.3"
hex = "0.4.3"
rmpv = "1.3.1"
toml = "1.1.2"

# Networking and system
default-net = "0.22.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
get_if_addrs = "0.5.3"
hostname = { version = "0.4.2", features = ["set"] }
libc = "0.2.184"
mdns-sd = "0.18.2"
netlink-packet-route = "0.29.0"
nix = { version = "0.31.2", default-features = false, features = ["signal", "process"] }
notify = "6.1.1"
nt_client = { version = "0.5.1", features = ["publish_bypass"] }
reqwest = { version = "0.13.2", features = ["json", "rustls", "stream"] }
rtnetlink = "0.20.0"
sha2 = "0.11.0"
webpki-root-certs = "1.0.6"

# Math and geometry
bytemuck = "1.25.0"
fast_image_resize = { version = "6.0.0", features = ["image", "rayon"] }
geo = { version = "0.32.0", default-features = false }
libblur = { version = "0.23.3", features = ["image"] }
nalgebra = "0.34.2"
num = "0.4.3"
rand = "0.10.0"
rayon = "1.11.0"
wide = "1.2.0"

# Media and CV
ab_glyph = "0.2.32"
ffmpeg = { version = "8.1.0", package = "ffmpeg-next" }
image = { version = "0.25.10", features = ["serde"] }
imageproc = { version = "0.26.1", features = ["rayon"] }
memchr = "2.8.0"
memmap2 = "0.9.9"
smallvec = "1.15.1"

# Web and API
axum = { version = "0.8.8", features = ["http1"] }
utoipa = { version = "5.4.0", features = ["actix_extras", "macros", "uuid", "chrono"] }

# Build and dynamic libraries
libloading = "0.9.0"

# ML and inference
rusb = "0.9.4"
tract-core = "0.22.1"
tract-onnx = "0.22.1"
tract-tflite = "0.22.1"

# Testing and archives
criterion = { version = "0.8.2", features = ["html_reports"] }
flate2 = "1.1.9"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
tar = "0.4.44"
tempfile = "3.27.0"

# External repos
# Declared exactly as Styx and Eidos declare them (git + branch): Cargo treats
# `branch`, `tag` and `rev` as different sources, and two copies of Daedalus
# or Styx would mean two FrameLease and Payload types. The exact commits are
# pinned by Cargo.lock (`cargo update -p <crate>` moves them):
#   Daedalus v3.0.0 (e7e88fc), Styx 3ab3707, Eidos 47e9f1d, Orion v4 (main),
#   Lemnos dev.
daedalus = { package = "daedalus-rs", version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-data = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-macros = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev" }
daedalus-planner = { version = "3.0.0", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev", default-features = false }
lemnos = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", default-features = false }
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", branch = "main", default-features = false }
styx = { version = "2.0.0", git = "https://github.com/Prometheus-Dynamics/Styx.git", branch = "dev", default-features = false }
eidos-aruco = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }
eidos-core = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }
eidos-daedalus = { git = "https://github.com/Prometheus-Dynamics/Eidos.git", branch = "main", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Services are built for size; per-frame vision code is built for speed. Both
# levels matter under fat LTO: each crate's own (Eidos at "z" made the ArUco
# graph 4x slower) and the final artifact's (the engine and probe run the
# graph; the Eidos plugin library links the stages).
[profile.release.package.helios-eidos-plugin]
opt-level = 3

[profile.release.package.helios-engine]
opt-level = 3

[profile.release.package.helios-vision-probe]
opt-level = 3

# Eidos (per-frame CV) is built for speed too.
[profile.release.package.eidos-daedalus]
opt-level = 3

[profile.release.package.eidos-aruco]
opt-level = 3

[profile.release.package.eidos-calibration]
opt-level = 3

[profile.release.package.eidos-color]
opt-level = 3

[profile.release.package.eidos-contour]
opt-level = 3

[profile.release.package.eidos-core]
opt-level = 3

[profile.release.package.eidos-detectors]
opt-level = 3

[profile.release.package.eidos-draw]
opt-level = 3

[profile.release.package.eidos-filter]
opt-level = 3

[profile.release.package.eidos-frame]
opt-level = 3

[profile.release.package.eidos-geometry]
opt-level = 3

[profile.release.package.eidos-mask]
opt-level = 3

[profile.release.package.eidos-motion]
opt-level = 3

[profile.release.package.eidos-sampling]
opt-level = 3

[profile.release.package.eidos-scratch]
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

# Faster local iteration profile: keeps release-like behavior while avoiding
# expensive full LTO during the final link step.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
                                       

[workspace.lints.rust]
unsafe_code = "warn"
# unused = "allow"

[workspace]
resolver = "3"
members = [
    "src/libs/lib-ai",
    "src/libs/lib-api/lib-api-macro",
    "src/libs/lib-api/lib-asyncapi",
    "src/libs/lib-api/lib-asyncapi-macro",
    "src/libs/lib-api/lib-ws",
    "src/libs/lib-api/lib-ws-macro",
    "src/libs/lib-api/lib-nt4",
    "src/libs/lib-api/lib-nt4-macro",
    "src/libs/lib-api/lib-transport",
    "src/libs/lib-led-animations",
    "src/libs/lib-led-plugin",
    "src/libs/lib-nt4-plugin",
    "src/libs/lib-net",
    "src/libs/lib-math",
    "src/libs/lib-sensors",
    "src/libs/lib-test",
    "src/libs/lib-test-macro",
    "src/libs/lib-cv",
    "src/libs/lib-ipc",
    "src/plugins/helios-daedalus-cv-plugin",
    "src/plugins/helios-daedalus-ai-plugin",
    "src/plugins/helios-daedalus-nt4-plugin",
    "src/plugins/helios-daedalus-led-plugin",
    "src/helios-api",
    "src/helios-engine",
    "src/helios-peripherals",
    "src/helios-updater",
    "src/helios-usb-recoveryd",
    "src/helios-boot-buttond",
    "src/helios-diagnostics",
    "tools/dev-sim",
    "tools/heliosctl",
    "tools/helios-usbctl",
    "tools/helios-provision",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
tracing = "0.1.41"
tracing-appender = "0.2.3"
serde_json="1.0.143"
serde = { version = "1.0.219", features = ["derive"] }
derive_more = {version = "2.0.1", features = ["from", "display", "error"] } 
thiserror = "1.0.63"
bincode = { version = "2.0.1", features = ["serde", "derive"] }
tracing-subscriber = {version = "0.3.20", features = ["json","fmt", "env-filter", "registry"] }
extern-v4l2 = {version = "0.14.0", features = ["v4l2"], package = "v4l"}
extern-libcamera = { package = "libcamera", version = "0.6.0", features = ["vendor_draft"] }
image = { version = "0.25.9", features = ["serde"] }
imageproc = {version = "0.25.0", features = ["rayon"]}
tokio = { version = "1.47.1", features = ["full"]}
rayon = "1.11.0"
bytemuck = "1.23.2"
ffmpeg = {version= "8.0.0", package = "ffmpeg-next"}
uuid = {version = "1.18.0", features = ["v4", "v5", "serde"]}
futures = "0.3.31"
futures-util = "0.3.31"
async-trait = "0.1.89"
nt_client = { version = "0.4.0", features = ["publish_bypass"] }
rmpv = "1.3.0"
regex = "1.11.2"
bitflags = { version = "2.9.3", features = ["serde"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls", "stream"] }
multipart-stream = "0.1.2"
mime = "0.3.17"
glob = "0.3.3"
utoipa = { version = "5.4.0", features = ["actix_extras", "macros", "uuid", "chrono"] }

utoipa-actix-web = "0.1.2"
dotenv = "0.15.0"
sysinfo = { version = "0.37.0", features = ["component"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tokio-stream = "0.1.17"
url = { version = "2.5.7", features = ["serde"] }
schemars = { version = "1.0.4", features = ["derive"] }
bitvec = "1.0.1"
once_cell = "1.20.2"
serde_bytes = "0.11.17"
toml = "0.9.5"
syn = { version = "2.0.106", features = ["full"] }
nalgebra = "0.33.2"
quote = "1.0.40"
proc-macro2 = "1.0.101"
paste = "1.0.15"
anyhow = "1.0.98"
libc = "0.2.169"
clap = { version = "4.5.46", features = ["derive", "env"] }
actix-web = "4.11.0"
actix-web-actors = "4.3.0"
actix = "0.13.5"
styx = { git = "https://github.com/Prometheus-Dynamics/Styx.git", branch = "main", default-features = false }
daedalus = { package = "daedalus-rs", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "main" }
daedalus-data = { package = "daedalus-data", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "main" }
daedalus-macros = { package = "daedalus-macros", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "main" }
geo = { version = "0.30.0", default-features = false }
linux-embedded-hal = "0.4.0"
rand = "0.9.2"
bytes = "1.6.1"
sd-notify = "0.4.1"
sha2 = "0.10.8"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
hex = "0.4.3"
metrics = "0.23.0"
metrics-exporter-prometheus = { version = "0.14.0", default-features = false, features = ["http-listener"] }
lib-test = { path = "src/libs/lib-test" }
heck = "0.5.0"

[profile.release]
opt-level = 3  # Maximum optimization level (default for release)
lto = true
codegen-units = 1
# Keep enough info for actionable on-device crash reports.
debug = 1
strip = "none"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true

# Faster local iteration profile: keeps release-like behavior while avoiding
# expensive full LTO during the final link step.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[patch.crates-io]
libcamera = { path = "vendor/libcamera" }

[patch."https://github.com/Prometheus-Dynamics/Styx.git"]
styx = { path = "/home/sozo/Documents/GitHub/Styx/crates/styx" }
                                       

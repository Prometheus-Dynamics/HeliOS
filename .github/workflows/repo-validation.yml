name: Repo Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-validation:
    runs-on: ubuntu-24.04
    env:
      HELIOS_CARGO_CONFIG: ${{ runner.temp }}/helios-ci-cargo-overrides.toml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Styx override
        run: |
          git clone https://github.com/Prometheus-Dynamics/Styx.git "$RUNNER_TEMP/styx"
          git -C "$RUNNER_TEMP/styx" checkout ecd4b958cd86155acc81f23254fdc4a31fc3e7a1

      - name: Write CI cargo override
        run: |
          cat > "$HELIOS_CARGO_CONFIG" <<EOF
          [patch."https://github.com/Prometheus-Dynamics/Styx.git"]
          styx = { path = "$RUNNER_TEMP/styx/crates/styx" }
          EOF

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Run xtask tests
        run: cargo --config "$HELIOS_CARGO_CONFIG" test --manifest-path backend/Cargo.toml -p xtask

      - name: Validate repo policy
        run: cargo --config "$HELIOS_CARGO_CONFIG" run --manifest-path backend/Cargo.toml -p xtask -- validate repo-policy

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: UI typecheck
        working-directory: ui
        run: bun run check

      - name: UI production build
        working-directory: ui
        run: bun run build

name: Repo Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-validation:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Run xtask tests
        run: cargo test --manifest-path backend/Cargo.toml -p xtask

      - name: Validate repo policy
        run: cargo run --manifest-path backend/Cargo.toml -p xtask -- validate repo-policy

      - name: Validate generated contracts
        run: cargo run --manifest-path backend/Cargo.toml -p xtask -- validate generated-contracts

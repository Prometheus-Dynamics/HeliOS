name: Shim Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shim-guardrails:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shim guardrail tests
        run: python3 tools/test_shim_guardrails.py

      - name: Check shim guardrails
        run: python3 tools/shim_guardrails.py

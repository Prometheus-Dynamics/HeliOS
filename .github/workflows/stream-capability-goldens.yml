name: Stream Capability Goldens

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stream-capability-goldens:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-backend-target-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-target-

      - name: Verify capability and compatibility goldens
        working-directory: backend
        run: cargo test -p helios-api stream_capability_compatibility_goldens_are_in_sync -- --nocapture

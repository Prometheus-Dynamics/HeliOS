name: Deploy Docusaurus To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docusaurus-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Compute Pages site URL
        env:
          DOCS_CUSTOM_DOMAIN: ${{ vars.DOCS_CUSTOM_DOMAIN }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          domain="${DOCS_CUSTOM_DOMAIN#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"

          if [ -n "$domain" ]; then
            echo "DOCUSAURUS_URL=https://$domain" >> "$GITHUB_ENV"
            echo "DOCUSAURUS_BASE_URL=/" >> "$GITHUB_ENV"
            echo "Publishing docs for custom domain https://$domain/"
          else
            echo "DOCUSAURUS_URL=https://$GITHUB_REPOSITORY_OWNER.github.io" >> "$GITHUB_ENV"
            echo "DOCUSAURUS_BASE_URL=/$GITHUB_EVENT_REPOSITORY_NAME/" >> "$GITHUB_ENV"
            echo "Publishing docs for project Pages under /$GITHUB_EVENT_REPOSITORY_NAME/"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

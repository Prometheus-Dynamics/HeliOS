name: Architecture Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  architecture-guardrails:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run architecture guardrail tests
        run: python3 tools/test_architecture_guardrails.py

      - name: Check architecture guardrails
        run: python3 tools/architecture_guardrails.py

# Serve DHCP on the USB gadget subnet via the bridge that aggregates gadget NICs.
interface=usbbr0
bind-dynamic
dhcp-authoritative
dhcp-range=172.31.250.2,172.31.250.20,255.255.255.0,1h
dhcp-leasefile=/var/lib/helios/state/dnsmasq.leases
# Do not advertise a default route to the host.
dhcp-option=option:router

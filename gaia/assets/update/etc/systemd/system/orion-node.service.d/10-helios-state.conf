# HeliOS drop-in for Orion's orion-node.service: the node's state lives in
# /var/lib/helios/orion (ORION_NODE_STATE_DIR in /etc/default/orion-node.env),
# which is on the data partition (/data/helios, bound by helios-data-setup),
# so desired state survives A/B updates.
[Unit]
RequiresMountsFor=/var/lib/helios

[Service]
# Created and owned by systemd for the orion user, and writable despite
# ProtectSystem=strict. StateDirectory= accumulates with the unit's `orion`.
StateDirectory=helios/orion

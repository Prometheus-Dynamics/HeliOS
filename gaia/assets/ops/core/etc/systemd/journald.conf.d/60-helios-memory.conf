[Journal]
# Keep journald small on embedded targets. Large active journal files get mmapped by
# systemd-journald and showed up as a major resident-memory bucket on live devices.
SystemMaxUse=16M
SystemKeepFree=64M
SystemMaxFileSize=4M
RuntimeMaxUse=8M
RuntimeMaxFileSize=4M
Compress=yes
# The API's live log tail reads journald's syslog forward (/run/systemd/journal/syslog, bound
# only while someone follows) instead of a journalctl -f per filter (~8 MB each).
ForwardToSyslog=yes

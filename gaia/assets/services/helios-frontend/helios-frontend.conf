server.document-root = "/opt/helios/frontend"
server.bind = "0.0.0.0"
server.port = 5800
server.max-fds = 2048

server.modules = (
  "mod_access",
  "mod_alias",
  "mod_redirect",
  "mod_indexfile",
  "mod_staticfile",
  "mod_proxy"
)

index-file.names = ( "index.html" )

# Single-page-app fallback: serve index.html when path is not a file (exclude docs)
$HTTP["url"] !~ "^/docs/" {
  server.error-handler-404 = "/index.html"
}

# Stream proxied responses (MJPEG, SSE) without buffering the whole body
# 2 = fully streaming (no temp files); mirror with server.* to keep body passthrough
proxy.stream-response-body = 2
server.stream-response-body = 2

# Proxy API traffic (including SSE/WebSocket upgrade) to helios-api on 5801
$HTTP["url"] =~ "^/v1" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 5801 ) ) )
  proxy.header = ( "upgrade" => "enable" )
}

mimetype.assign = (
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".wasm" => "application/wasm",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".ico"  => "image/x-icon",
)

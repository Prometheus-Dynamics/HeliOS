# Expose the Helios frontend stack on port 80 by proxying to :5800.
server.modules += ( "mod_proxy" )

# Keep long-lived stream responses (preview, SSE) flowing through :80 without
# buffering; otherwise clients can time out waiting for stream bytes.
server.stream-response-body = 2

$HTTP["url"] =~ "^/" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 5800 ) ) )
}

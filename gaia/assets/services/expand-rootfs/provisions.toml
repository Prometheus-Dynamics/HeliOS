[defaults]
align_mib = 4
root_min_mib = 256
log_file = "/var/log/expand-rootfs-prepare.log"

[spans]
boot_partition = 1
data_size_mib = 4096

[[partitions]]
name = "ACTIVE"
number = 2
label = "ACTIVE"
mode = "resize"
target_percent = 50
max_mib = 5120
marker = "/etc/helios/.provision.active_v1"

[[partitions]]
name = "RESERVE"
number = 3
label = "RESERVE"
mode = "mkpart"
target_percent = 50
max_mib = 5120
fs_type = "ext4"
marker = "/etc/helios/.provision.reserve_v1"

[[partitions]]
name = "DATA"
number = 4
label = "DATA"
mode = "mkpart"
size_mib = 4096
fs_type = "ext4"
marker = "/etc/helios/.provision.data_v1"
mount_point = "/var/lib/helios"
secondary_marker = "/var/lib/helios/.provision.data_v1"

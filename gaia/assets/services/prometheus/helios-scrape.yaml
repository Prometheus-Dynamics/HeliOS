# Prometheus scrape configuration for Helios control plane services
scrape_configs:
  - job_name: 'helios-api'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'helios-api.staging.internal:9100'
        labels:
          service: helios-api
  - job_name: 'helios-engine'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'helios-engine.staging.internal:9101'
        labels:
          service: helios-engine
  - job_name: 'helios-updater'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'helios-updater.staging.internal:9102'
        labels:
          service: helios-updater

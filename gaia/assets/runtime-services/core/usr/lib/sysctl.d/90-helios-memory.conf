# Cap the kernel's per-CPU free page lists. Left to tune itself it keeps 32-37 MB of free pages
# there on a Raze (4 fake NUMA nodes, 4 CPUs); the kernel does not count those as free, so
# MemAvailable reads 24-28 MB lower. With this cap the lists hold about 6 MB. Measured on a CM5 at
# 120 fps: cycles per frame unchanged. Mostly this is free memory counted differently, not memory
# the system gains.
vm.percpu_pagelist_high_fraction = 1000

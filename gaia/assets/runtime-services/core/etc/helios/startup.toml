# HeliOS first-boot startup file, read by helios-api when it starts (backend/src/helios/api/src/startup.rs).
#
# [default_pipeline] is the pipeline helios-api creates on the first camera when the board has no
# pipelines yet, with the pipeline id "default". It is created once. If the user deletes it, it stays
# deleted, through reboots and updates, because helios-api keeps the decision in its state directory
# (/var/lib/helios/api/default-pipeline.json). Remove that file to have it created again (only while
# the board has no pipelines).
#
# No [default_pipeline] (or enabled = false, or a file helios-api cannot parse) means no pipeline is
# created; the API still starts. See docs/docs/api/http.md, "First-boot default pipeline".

[default_pipeline]
# Create the pipeline. Default true.
enabled = true

# Its name in the API and the UI.
name = "AprilTag"

# An embedded golden graph id (backend/src/helios/engine/graphs/). Known: "apriltag-36h11".
graph = "apriltag-36h11"

# The Eidos tag family the graph decodes: FRC's family since 2024. Optional; the graph's own is kept
# when unset.
dictionary = "apriltag_36h11"

# Half-size pyramid levels attached to each camera frame: Styx's ISP half level, much cheaper than the
# detector building it itself. Optional; omit it to attach none.
pyramid = 1

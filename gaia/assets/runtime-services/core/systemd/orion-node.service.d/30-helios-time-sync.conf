# orion-node keeps the board's clock (Orion docs/time-sync.md), in place of systemd-timesyncd,
# which the Raze device package masks in the same image. From Orion's
# packaging/systemd/orion-node.service.d/time-sync.conf.example: CAP_SYS_TIME is the only
# capability added, and @clock allows clock_settime next to the unit's @system-service filter.
[Service]
CapabilityBoundingSet=CAP_SYS_TIME
AmbientCapabilities=CAP_SYS_TIME
SystemCallFilter=@clock
Environment=ORION_NODE_TIME_SYNC=discipline
# Sources in rank order (the node takes the first that answers): internet NTP above any fleet
# peer. The SystemCore is never a source: its clock is not trustworthy (it read Oct 2025 on the
# test bed). The env files may override the list.
Environment=ORION_NODE_TIME_SERVERS=time.cloudflare.com,time.google.com,pool.ntp.org

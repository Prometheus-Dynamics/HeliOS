# HeliOS drop-in for Orion's orion-node.service: keep the node's state on the
# DATA partition (/var/lib/helios, shared by both root slots) instead of the
# per-slot overlay, so desired state survives an A/B update.
# ORION_NODE_STATE_DIR=/var/lib/helios/orion is set in /etc/default/orion-node.env.
[Service]
# Created and owned by systemd for the orion user, and writable despite
# ProtectSystem=strict. StateDirectory= accumulates with the unit's `orion`.
StateDirectory=helios/orion
# Same check as the HeliOS service overrides: fail rather than write state to
# the overlay when the DATA partition is not mounted.
ExecStartPre=/bin/sh -lc 'awk '\''$5==\"/var/lib/helios\"{found=1} END{exit !found}'\'' /proc/self/mountinfo || { echo \"DATA mount missing: /var/lib/helios is not a mountpoint\" >&2; exit 1; }'

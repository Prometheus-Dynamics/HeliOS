# The host keys are on /data (HostKey in /etc/ssh/sshd_config), made by
# helios-data-setup. Buildroot's unit runs `ssh-keygen -A`, which writes to
# /etc/ssh and fails on the read-only root: drop it.
[Unit]
After=network.target helios-data-setup.service
Wants=network.target
RequiresMountsFor=/data

[Service]
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755
ExecStartPre=

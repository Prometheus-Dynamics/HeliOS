# The host keys are the board's (the device package's board-ssh-hostkeys, on
# /data/ssh). Buildroot's unit runs `ssh-keygen -A`, which writes to /etc/ssh
# and fails on the read-only root: drop it.
[Unit]
After=network.target helios-data-setup.service
Wants=network.target
RequiresMountsFor=/data

[Service]
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755
ExecStartPre=

enabled = true
default_profile = "aarch64-linux"
check_policy = "required"

[profiles.aarch64-linux]
target = "aarch64-unknown-linux-gnu"

[profiles.host]

[[checks]]
id = "cargo-fmt"
run = ["cargo", "fmt", "--all", "--check"]
applies_to = ["rust", "lint"]
cwd = "../backend"

[[checks]]
id = "cargo-clippy"
run = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
applies_to = ["rust", "lint"]
cwd = "../backend"

[[checks]]
id = "frontend-lint"
run = ["bun", "run", "lint"]
applies_to = ["custom", "lint"]
cwd = "../frontend"

[units."helios-engine.socket"]
enabled = true
src = "assets/services/helios-engine/helios-engine.socket"
unit = "helios-engine.socket"
targets = ["sockets"]

[units."helios-engine"]
enabled = true
src = "assets/services/helios-engine/helios-engine.service"
targets = ["multi-user"]
env_set = "helios-engine"
env_file = "/etc/default/helios-engine"

[units."helios-updater.socket"]
enabled = true
src = "assets/services/helios-updater/helios-updater.socket"
unit = "helios-updater.socket"
targets = ["sockets"]

[units."helios-updater"]
enabled = true
src = "assets/services/helios-updater/helios-updater.service"
targets = ["network", "multi-user"]

[units."helios-usb-recoveryd"]
enabled = true
src = "assets/services/helios-usb-recoveryd/helios-usb-recoveryd.service"
targets = ["sysinit", "basic", "multi-user"]
env_set = "helios-usb-recoveryd"
env_file = "/etc/default/helios-usb-recoveryd"

[units."helios-boot-buttond"]
enabled = true
src = "assets/services/helios-boot-buttond/helios-boot-buttond.service"
targets = ["multi-user"]
env_set = "helios-boot-buttond"
env_file = "/etc/default/helios-boot-buttond"
assets = [
  { src = "assets/services/helios-boot-buttond/helios-network-reset.sh", dst = "/usr/local/bin/helios-network-reset.sh", mode = 493 },
]

[units."helios-peripherals"]
enabled = true
src = "assets/services/helios-peripherals/helios-peripherals.service"
targets = ["multi-user"]
env_set = "helios-peripherals"
env_file = "/etc/default/helios-peripherals"

[units."helios-fan-overlays"]
enabled = true
src = "assets/services/fan-overlays/helios-fan-overlays.service"
targets = ["sysinit", "multi-user"]
assets = [
  { src = "assets/services/fan-overlays/helios-fan-overlays.sh", dst = "/usr/local/bin/helios-fan-overlays.sh", mode = 493 },
]

[units."helios-os-self-check"]
enabled = true
src = "assets/services/storage/helios-os-self-check.service"
targets = ["multi-user"]
assets = [
  { src = "assets/services/storage/helios-os-self-check.sh", dst = "/usr/local/bin/helios-os-self-check.sh", mode = 493 },
]

[units."helios-api"]
enabled = true
src = "assets/services/helios-api/helios-api.service"
targets = ["multi-user"]
env_set = "helios-api"
env_file = "/etc/default/helios-api"
assets = [
  { src = "assets/services/helios-api/helios-api-startup-sanitize.sh", dst = "/usr/local/bin/helios-api-startup-sanitize.sh", mode = 493 },
  { src = "assets/services/helios-api/startup.toml", dst = "/etc/helios/startup.toml", mode = 420 },
  { src = "assets/services/helios-api/FRC2026_ANDYMARK.fmap", dst = "/usr/share/helios/media/FRC2026_ANDYMARK.fmap", mode = 420 },
]

[units."helios-ide"]
# Disabled for now: avoid unnecessary startup overhead and restart churn.
enabled = false
src = "assets/services/helios-ide/helios-ide.service"
targets = ["multi-user"]
assets = [
  { src = "assets/services/helios-ide/helios-ide-setup.sh", dst = "/usr/local/bin/helios-ide-setup.sh", mode = 493 },
]

# Core diagnostics system (binary + failure-triggered units)
[units."helios-diagnostics"]
enabled = true
src = "assets/services/diagnostics/helios-diagnostics@.service"
unit = "helios-diagnostics@.service"
targets = []
assets = [
  { src = "assets/services/diagnostics/helios.diagnostics.conf", dst = "/etc/systemd/system/helios-api.service.d/diagnostics.conf", mode = 420 },
  { src = "assets/services/diagnostics/helios.diagnostics.conf", dst = "/etc/systemd/system/helios-engine.service.d/diagnostics.conf", mode = 420 },
  { src = "assets/services/diagnostics/helios.diagnostics.conf", dst = "/etc/systemd/system/helios-updater.service.d/diagnostics.conf", mode = 420 },
  { src = "assets/services/diagnostics/helios.diagnostics.conf", dst = "/etc/systemd/system/helios-usb-recoveryd.service.d/diagnostics.conf", mode = 420 },
  { src = "assets/services/diagnostics/helios-usb-gadget.diagnostics.conf", dst = "/etc/systemd/system/helios-usb-gadget.service.d/diagnostics.conf", mode = 420 },
  { src = "assets/services/diagnostics/helios-dnsmasq.diagnostics.conf", dst = "/etc/systemd/system/helios-dnsmasq.service.d/diagnostics.conf", mode = 420 },
]

# Serve the staged frontend bundle on port 5800
[units."helios-frontend"]
enabled = true
src = "assets/services/helios-frontend/helios-frontend.service"
targets = ["multi-user"]
assets = [
  { src = "assets/services/helios-frontend/helios-frontend.conf", dst = "/etc/lighttpd/helios-frontend.conf", mode = 420 },
  { src = "assets/services/helios-frontend/90-helios-frontend-proxy.conf", dst = "/etc/lighttpd/conf-enabled/90-helios-frontend-proxy.conf", mode = 420 },
]

# Set CPU governor from image defaults (with runtime override support).
[units."helios-set-governor"]
enabled = true
src = "assets/services/cpu-governor/helios-set-governor.service"
targets = ["multi-user"]
assets = [
  { src = "assets/services/cpu-governor/set-governor.sh", dst = "/opt/set-governor.sh", mode = 493 },
]

# Set system clock to the build time very early (no network/RTC required)
[units."helios-set-build-time"]
enabled = true
src = "assets/services/time/helios-set-build-time.service"
targets = ["sysinit"]
assets = [
  { src = "assets/services/time/helios-set-build-time.sh", dst = "/usr/local/bin/helios-set-build-time.sh", mode = 493 },
]

[units."helios-journal-vacuum"]
enabled = true
src = "assets/services/systemd/helios-journal-vacuum.service"
targets = ["multi-user"]
assets = [
  { src = "assets/services/systemd/60-helios-journald-memory.conf", dst = "/etc/systemd/journald.conf.d/60-helios-memory.conf", mode = 420 },
  { src = "assets/services/systemd/helios-journal-vacuum.sh", dst = "/usr/local/bin/helios-journal-vacuum.sh", mode = 493 },
]

# OTA confirm service (unit + script)
[units."helios-ota-confirm"]
enabled = true
src = "assets/services/ota/helios-ota-confirm.service"
assets = [
  { src = "helios-ota-confirm.sh", dst = "/usr/local/bin/helios-ota-confirm.sh", mode = 493 },
]

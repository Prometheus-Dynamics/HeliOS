[units."helios-dnsmasq"]
enabled = true
src = "assets/services/gadget/etc/systemd/system/helios-dnsmasq.service"
targets = ["network", "multi-user"]
assets = [
  { src = "assets/services/gadget/etc/dnsmasq.d/usb0.conf", dst = "/etc/dnsmasq.d/usb0.conf", mode = 420 },
]

[units."helios-usb-gadget"]
enabled = true
src = "assets/services/gadget/etc/systemd/system/helios-usb-gadget.service"
targets = ["sysinit", "multi-user", "default"]
assets = [
  { src = "assets/services/gadget/usr/local/bin/usb-gadget-setup.sh", dst = "/usr/local/bin/usb-gadget-setup.sh", mode = 493 },
  { src = "assets/services/gadget/usr/local/bin/usb-gadget-reset.sh", dst = "/usr/local/bin/usb-gadget-reset.sh", mode = 493 },
  { src = "assets/services/gadget/usr/local/bin/usb-gadget-watchdog.sh", dst = "/usr/local/bin/usb-gadget-watchdog.sh", mode = 493 },
]

[units."helios-usb-gadget-watchdog"]
enabled = true
src = "assets/services/gadget/etc/systemd/system/helios-usb-gadget-watchdog.service"
targets = ["multi-user"]

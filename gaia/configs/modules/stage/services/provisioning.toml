[units.helios-provision]
enabled = true
src = "assets/services/expand-rootfs/helios-provision.target"
unit = "helios-provision.target"
targets = ["local-fs"]

[units."helios-provision.service"]
enabled = true
src = "assets/services/expand-rootfs/helios-provision.service"
unit = "helios-provision.service"
targets = ["helios-provision", "local-fs"]
assets = [
  { src = "assets/generated/storage-layouts/ext4-labels.toml", dst = "/etc/helios/storage-layout.toml", mode = 420 },
  { src = "assets/generated/storage-layouts/ext4-labels.env", dst = "/etc/helios/storage-layout.env", mode = 420 },
  { src = "assets/services/storage/helios-data.mount", dst = "/etc/systemd/system/var-lib-helios.mount", mode = 420 },
]

# Data mount (copied as an asset above); kept here to avoid “missing config key” surprises
[units."helios-data.mount"]
enabled = true
src = "assets/services/storage/helios-data.mount"
unit = "var-lib-helios.mount"
targets = ["local-fs"]

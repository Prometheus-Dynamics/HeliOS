# What a full HeliOS image must contain: validation fails if any of these disappears
# (a layer deleted, emptied by a bad write, no longer imported, or its `when`
# no longer matching), instead of silently building an image without it.

config = 3

[expect]
artifacts = ["helios-api", "helios-engine", "helios-diagnostics", "orion-node", "orionctl", "board-stream"]
installs = ["install-helios-api", "install-helios-engine", "install-helios-diagnostics", "install-orion-node", "install-orionctl", "install-board-stream"]


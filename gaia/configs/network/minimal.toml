description = "Shared minimal network layer: Ethernet DHCP with mDNS, answered by systemd-resolved (no avahi)."

[stage]

[[stage.files]]
id = "network-ethernet-dhcp"
src = "@assets/network/etc/systemd/network/10-eth0.network"
dest = "/etc/systemd/network/10-eth0.network"
origin = "static-asset"

[[stage.files]]
id = "network-wait-online-override"
src = "@assets/network/etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf"
dest = "/etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf"
origin = "static-asset"

[image]
kind = "buildroot"
# systemd-resolved is the mDNS responder (the device package turns it on in
# resolved.conf.d and advertises _pd-device._tcp); avahi would contend for
# port 5353.
config_overrides = [
  ["BR2_PACKAGE_SYSTEMD_RESOLVED", "y"],
  ["BR2_PACKAGE_AVAHI", "n"],
]

[image.feed]
stage_files = ["network-ethernet-dhcp", "network-wait-online-override"]

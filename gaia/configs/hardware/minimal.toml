description = "Shared runtime hardware-data layer for the appliance payloads: lighting templates. The fan is driven by the kernel thermal governor (device package raze-fan overlay); the sensor description is /usr/share/pd-device/raze/sensors.toml from the device package."

[[stage.files]]
id = "hardware-lighting-templates"
src = "@assets/hardware/runtime/usr/share/helios/lighting-templates"
dest = "/usr/share/helios/lighting-templates"
origin = "static-asset"

[image]
kind = "buildroot"

[image.feed]
stage_files = [
  "hardware-lighting-templates",
]

description = "Shared backend-core runtime-service layer: core backend units, sockets, tightly-coupled service assets, and HeliOS's settings for Orion's orion-node unit."

[[stage.files]]
id = "runtime-api-startup"
src = "@assets/runtime-services/core/etc/helios/startup.toml"
dest = "/etc/helios/startup.toml"
origin = "static-asset"

# orion-node.service, its sysusers entry and preset come from Orion's layer
# (imported before this one). HeliOS replaces only the environment file, by
# redeclaring its id with the same dest, as that layer documents: the
# single-node appliance profile, plus group access for the HeliOS services
# and state on the data partition (/var/lib/helios is bound from /data/helios).
[[stage.files]]
id = "orion-node-env"
src = "@assets/runtime-services/core/etc/default/orion-node.env"
dest = "/etc/default/orion-node.env"
mode = 420
origin = "static-asset"

[[stage.services]]
id = "helios-api-service"
name = "helios-api.service"
unit_path = "@assets/runtime-services/core/systemd/helios-api.service"

[[stage.services]]
id = "helios-engine-service"
name = "helios-engine.service"
unit_path = "@assets/runtime-services/core/systemd/helios-engine.service"

[[stage.services]]
id = "helios-engine-socket"
name = "helios-engine.socket"
unit_path = "@assets/runtime-services/core/systemd/helios-engine.socket"

[image]
kind = "buildroot"
# orion-node.service runs as the `orion` user. The root filesystem is a
# read-only EROFS slot, so the user is created at build time rather than by
# systemd-sysusers (Orion packaging/README.md, "The orion user"), from Orion's
# own users table. lemnosd's `lemnos` user comes from the device package
# (Atlas's lemnos.toml adds Lemnos's table next to this list).
config_overrides = [
  ["BR2_ROOTFS_USERS_TABLES", "\"${source.orion.path}/packaging/buildroot/orion-users.table\""],
]

[image.feed]
stage_files = [
  "runtime-api-startup",
]
stage_services = [
  "helios-api-service",
  "helios-engine-service",
  "helios-engine-socket",
]

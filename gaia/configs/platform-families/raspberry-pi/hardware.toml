description = "Shared Raspberry Pi hardware support that should not leak into generic aarch64 builds."

[image]
kind = "buildroot"
config_overrides = [
  ["BR2_PACKAGE_LINUX_FIRMWARE_RP2", "y"],
  ["BR2_PACKAGE_RPI_USERLAND", "y"],
  ["BR2_PACKAGE_RPI_FIRMWARE_VARIANT_PI4", "y"],
  ["BR2_PACKAGE_HOST_DTC", "y"],
]

[stage]

[[stage.files]]
id = "hardware-i2c-dev"
src = "@assets/hardware/etc/modules-load.d/i2c-dev.conf"
dest = "/etc/modules-load.d/i2c-dev.conf"
origin = "static-asset"

[image.feed]
stage_files = ["hardware-i2c-dev"]

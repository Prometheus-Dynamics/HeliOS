description = "Raze target: HeliOS on the Raze device package. The package (imported before this file) provides the kernel, OV9782 support, libcamera/libpisp, raze-device.txt and its overlays, and the device services; this file adds HeliOS's own boot files, kernel fragments, initramfs, unit presets and image assembly."
target = "raze"

# Presets that sort before the device package's 70-pd-device.preset (see the
# file for what HeliOS turns off and why).
[[stage.files]]
id = "raze-helios-preset"
src = "@assets/os/usr/lib/systemd/system-preset/50-helios.preset"
dest = "/usr/lib/systemd/system-preset/50-helios.preset"
origin = "static-asset"

# The device package finds the boot partition (for SSH keys left in
# pd-device/authorized_keys) from the root mount's source, which is an overlay
# on HeliOS; name it instead.
[[stage.files]]
id = "raze-pd-device-ssh-keys-env"
src = "@assets/os/etc/pd-device/ssh-keys.env"
dest = "/etc/pd-device/ssh-keys.env"
origin = "static-asset"

[image]
kind = "buildroot"
# Device tree first, so its @source: token resolves; Gaia takes one value and
# the last import wins. Package overrides in HeliOS's packages/ would win over
# the device's; HeliOS keeps none of the device's (libcamera, libpisp).
external_tree = "@source:atlas/devices/raze/gaia/buildroot-external:gaia/assets/buildroot"
external_tree_mode = "required"
# defconfig, kernel tarball and hash, OV9782 extension, rpi-firmware overlays,
# rpi-userland and host-dtc come from the device package.
config_overrides = [
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "\"board/raspberrypi/linux-4k-page-size.fragment ${project.root_dir}/gaia/assets/buildroot/boards/helios-pi-squashfs/linux-squashfs-initramfs.fragment ${project.root_dir}/gaia/assets/buildroot/boards/helios-pi-squashfs/linux-no-wireless.fragment\""],
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "\"\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CONFIG_FILE", "\"${project.root_dir}/gaia/assets/buildroot/boards/helios-pi-squashfs/config.txt\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CMDLINE_FILE", "\"${project.root_dir}/gaia/assets/buildroot/boards/helios-pi-squashfs/cmdline.txt\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_VARIANT_PI4", "y"],
  ["BR2_TARGET_ROOTFS_EXT2", "n"],
]

[[image.expected_images]]
name = "sdcard.img"
format = "raw"
required = true

[image.feed]
stage_files = ["raze-helios-preset", "raze-pd-device-ssh-keys-env"]

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "$provider.images"

# The device package adds raze-device.txt, its overlays (ov9782, raze-fan,
# raze-usb-power) and the stock overlays it loads (dwc2, i2c1-pi5, i2c-gpio,
# ws2812-pio, vc4-kms-v3d-pi5) to this tree; config.txt includes it.
[[image.assembly.trees]]
id = "boot"
path = "$assembly.work/boot"

[[image.assembly.trees]]
id = "initramfs"
path = "$assembly.work/initramfs"

[[image.assembly.files]]
tree = "boot"
src = "@assets/buildroot/boards/helios-pi-squashfs/config.txt"
dest = "config.txt"

[[image.assembly.files]]
tree = "boot"
src = "@assets/buildroot/boards/helios-pi-squashfs/cmdline.txt"
dest = "cmdline.txt"

[[image.assembly.files]]
tree = "boot"
src = "@assets/buildroot/boards/helios-pi-squashfs/os_config.json"
dest = "os_config.json"

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/start4.elf"
dest = "start4.elf"

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/fixup4.dat"
dest = "fixup4.dat"

[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/build/rpi-firmware-*/boot/bcm2712-rpi-cm5-cm5io.dtb"
dest = "."
optional = true

# Kernel-built DTBs (bcm2712-rpi-cm5-cm5io, bcm2712-rpi-cm5l-cm5io); these
# replace the firmware copy above.
[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/images/bcm*.dtb"
dest = "."

# Loaded by HeliOS's config.txt; the device package does not ship it.
[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/bcm2712d0.dtbo"
dest = "overlays/bcm2712d0.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-wifi-pi5.dtbo"
dest = "overlays/disable-wifi-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-bt-pi5.dtbo"
dest = "overlays/disable-bt-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/overlay_map.dtb"
dest = "overlays/overlay_map.dtb"
optional = true

[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/build/rpi-firmware-*/boot/overlays/hat_map.dtb"
dest = "overlays/hat_map.dtb"
optional = true

[[image.assembly.dirs]]
tree = "initramfs"
path = "dev"

[[image.assembly.dirs]]
tree = "initramfs"
path = "proc"

[[image.assembly.dirs]]
tree = "initramfs"
path = "sys"

[[image.assembly.dirs]]
tree = "initramfs"
path = "mnt/data"

[[image.assembly.dirs]]
tree = "initramfs"
path = "mnt/lower"

[[image.assembly.dirs]]
tree = "initramfs"
path = "newroot"

[[image.assembly.symlinks]]
tree = "initramfs"
path = "lib64"
target = "lib"

[[image.assembly.symlinks]]
tree = "initramfs"
path = "usr/lib64"
target = "../lib"

[[image.assembly.files]]
tree = "initramfs"
src = "@assets/buildroot/boards/helios-pi-squashfs/init-overlay-root.sh"
dest = "init"
mode = "0755"

[[image.assembly.files]]
tree = "initramfs"
src = "$provider.target/etc/helios/storage-layout.env"
dest = "etc/helios/storage-layout.env"
optional = true

[[image.assembly.files]]
tree = "initramfs"
src = "$provider.target/lib/ld-linux-aarch64.so.1"
dest = "lib/ld-linux-aarch64.so.1"
mode = "0755"

[[image.assembly.files]]
tree = "initramfs"
src = "$provider.target/lib/libc.so.6"
dest = "lib/libc.so.6"

[[image.assembly.files]]
tree = "initramfs"
src = "$provider.target/lib/libresolv.so.2"
dest = "lib/libresolv.so.2"

[[image.assembly.transforms]]
kind = "gzip"
src = "$provider.buildroot_output/images/Image"
dest = "$assembly.tree.boot/kernel8.img"
deterministic = true

[[image.assembly.busybox_initramfs]]
tree = "initramfs"
busybox = "$provider.target/bin/busybox"
include_runtime_libs = false
applets = ["sh", "mount", "mkdir", "sleep", "sync", "switch_root", "cat", "umount", "insmod"]

[[image.assembly.filesystems]]
id = "initramfs8"
kind = "cpio-gzip"
source_tree = "initramfs"
output = "$assembly.tree.boot/initramfs8"
deterministic = true

[[image.assembly.filesystems]]
id = "boot"
kind = "vfat"
source_tree = "boot"
output = "$provider.images/boot.vfat"
size = "18M"

[[image.assembly.disks]]
id = "sdcard"
output = "$provider.images/sdcard.img"
partition_table = "mbr"
signature = "0x48454c49"
first_lba = 1
alignment_lba = 1

[[image.assembly.disks.partitions]]
name = "boot"
type_alias = "fat32-lba"
bootable = true
image = "$provider.images/boot.vfat"

[[image.assembly.disks.partitions]]
name = "rootfs"
type_alias = "linux"
image = "$provider.images/rootfs.squashfs"

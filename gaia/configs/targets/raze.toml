config = 3
description = "Raze target: HeliOS on the Raze device package. The package (imported before this file) provides the kernel, OV9782 support, libcamera/libpisp, raze-device.txt and its overlays, and the device services; this file adds HeliOS's own boot files, kernel options and image scripts. The image is the dynamic slots (builds/raze.toml imports Atlas's slots fragment), so this file has no disk of its own."
target = "raze"

# The CM5's Cortex-A76 ISA for every aarch64 artifact (Gaia G10): aes, crc, dotprod, fp16, lse, rcpc,
# rdm, sha2 beyond plain NEON; C code and Buildroot get -mcpu=cortex-a76 / BR2_cortex_a76.
[cpu]
profile = "cortex-a76"

[image]
kind = "buildroot"
# Device tree first, so its @source: token resolves; Gaia takes one value and
# the last import wins. Package overrides in HeliOS's packages/ would win over
# the device's; HeliOS keeps none of the device's (libcamera, libpisp).
external_tree = "${source.atlas}/devices/raze/gaia/buildroot-external:gaia/assets/buildroot:${source.styx}/kernel-modules/ov9282/buildroot"
external_tree_mode = "required"
# defconfig, kernel tarball and hash, OV9782 extension, rpi-firmware overlays,
# rpi-utils and host-dtc come from the device package.
config_overrides = [
  # Styx's kernel modules (the source is declared in builds/raze.toml).
  ["BR2_PACKAGE_STYX_OV9282", "y"],
  ["BR2_PACKAGE_STYX_RP1_CFE", "y"],
  ["BR2_PACKAGE_STYX_PISPBE", "y"],
  # The device package's kernel trim (pass 2, -O2): smaller kernel and module set, board-tested.
  ["BR2_RAZE_KERNEL_TRIM", "y"],
  # The device package installs only the overlays it loads (bcm2712d0 plus its
  # own); HeliOS's config.txt also turns the CM5's radios off, so add those two.
  ["BR2_PACKAGE_RPI_FIRMWARE_DTB_OVERLAYS", "\"bcm2712d0 disable-wifi-pi5 disable-bt-pi5\""],
  # host veritysetup, for Gaia's dm-verity step on the dynamic-slot root images (a host tool;
  # nothing lands in the target).
  ["BR2_PACKAGE_HOST_CRYPTSETUP", "y"],
  # The device package's kernel configuration (its trims, the built-in EROFS
  # the root needs, and the page size). HeliOS adds nothing, so every OS image
  # on a Raze runs the same kernel.
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "\"$(BR2_EXTERNAL_RAZE_DEVICE_PATH)/linux/raze.config\""],
  # post-build: the read-only root's fstab, mount points and /run links.
  ["BR2_ROOTFS_POST_BUILD_SCRIPT", "\"${project.root_dir}/gaia/assets/buildroot/scripts/post-build.sh\""],
  # post-fakeroot: /etc/slot.json from the slot identity Gaia stages (slots fragment).
  ["BR2_ROOTFS_POST_FAKEROOT_SCRIPT", "\"${project.root_dir}/gaia/assets/buildroot/scripts/post-fakeroot.sh\""],
  # post-image: a no-op. Buildroot's default board post-image runs genimage for the removed A/B
  # disk; Gaia assembles the slots image from rootfs.erofs instead.
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "\"${project.root_dir}/gaia/assets/buildroot/scripts/post-image.sh\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CONFIG_FILE", "\"${project.root_dir}/gaia/assets/buildroot/boards/raze/config.txt\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CMDLINE_FILE", "\"${project.root_dir}/gaia/assets/buildroot/boards/raze/cmdline.txt\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_VARIANT_PI4", "y"],
]

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

# --- boot tree -----------------------------------------------------------------
# The boot payload the dynamic slots are built from (the slots fragment's slots-payload and
# slots-fat trees read kernel8.img, the DTBs, the overlays and raze-device.txt from here). The
# device package adds raze-device.txt, its overlays (ov9782, raze-fan, raze-usb-power) and the
# stock overlays it loads to this tree. config.txt, cmdline.txt and os_config.json are the
# board's own copies; the slots use the slot cmdline the fragment writes.
[[image.assembly.trees]]
id = "boot"
path = "${assembly.work}/boot"

[[image.assembly.files]]
tree = "boot"
src = "${assets}/buildroot/boards/raze/config.txt"
dest = "config.txt"

[[image.assembly.files]]
tree = "boot"
src = "${assets}/buildroot/boards/raze/cmdline.txt"
dest = "cmdline.txt"

[[image.assembly.files]]
tree = "boot"
src = "${assets}/buildroot/boards/raze/os_config.json"
dest = "os_config.json"

# start4.elf/fixup4.dat are the Pi 4 GPU firmware. A CM5 boots from its EEPROM
# bootloader and never reads them, and rpi-firmware installs them only for its
# Pi 4 variant, so they are optional.
[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/start4.elf"
dest = "start4.elf"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/fixup4.dat"
dest = "fixup4.dat"
optional = true

# Kernel-built DTBs (bcm2712-rpi-cm5-cm5io, bcm2712-rpi-cm5l-cm5io), from images/ (the
# rpi-firmware package installs DTBs there only when it is built; the package's build/ tree is
# not read, since a restored package cache does not have it).
[[image.assembly.files]]
tree = "boot"
src_glob = "${provider.buildroot_output}/images/bcm*.dtb"
dest = "."

# Loaded by HeliOS's config.txt; the device package does not ship it.
[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/bcm2712d0.dtbo"
dest = "overlays/bcm2712d0.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/disable-wifi-pi5.dtbo"
dest = "overlays/disable-wifi-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/disable-bt-pi5.dtbo"
dest = "overlays/disable-bt-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/overlay_map.dtb"
dest = "overlays/overlay_map.dtb"
optional = true

[[image.assembly.files]]
tree = "boot"
# Not installed into images/ by Atlas's rpi-firmware override yet (only *.dtbo and overlay_map.dtb
# are): optional, so it is absent until Atlas installs it.
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/hat_map.dtb"
dest = "overlays/hat_map.dtb"
optional = true

[[image.assembly.transforms]]
kind = "gzip"
src = "${provider.buildroot_output}/images/Image"
dest = "${assembly.tree.boot}/kernel8.img"
deterministic = true


# No disk here: the Raze image is the dynamic slots (devices/raze/gaia/slots.toml, Atlas), which
# builds its own boot FAT and data partition from the boot tree above and rootfs.erofs, and
# publishes the first-flash .img.xz into outputs.dir (the only output; it also updates boards).

config = 3
description = "Slot updates with the Raze device package's slots writer: the health check its confirm runs, and orion-node's state on the data partition."

# The device package's slots writer (/usr/lib/board/slots, Atlas docs/slots.md)
# installs a slot bundle that helios-api uploads and stages (`slots stage`),
# trial-boots it (`slots apply`) and keeps it once update-health passes
# (`slots confirm`, from board-update-confirm.service); a failed trial falls back
# to the default slot. The writer runs no update.d hooks, so there are none here.
# helios-api drives it for /v1/update/*.

[[stage.files]]
id = "update-health"
src = "${assets}/update/etc/board/update-health"
dest = "/etc/board/update-health"
origin = "static-asset"
mode = 493

# A drop-in on Orion's orion-node.service (Orion's layer recommends drop-ins
# over an edited unit): state on the data partition.
[[stage.files]]
id = "orion-node-state"
src = "${assets}/update/etc/systemd/system/orion-node.service.d/10-helios-state.conf"
dest = "/etc/systemd/system/orion-node.service.d/10-helios-state.conf"
origin = "static-asset"

[image]
kind = "buildroot"

[image.feed]
stage_files = ["update-health", "orion-node-state"]

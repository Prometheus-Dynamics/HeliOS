[sets.helios-api]
LIBCAMERA_LOG_LEVELS = "*:WARN"
LIBCAMERA_IPA_LOG_LEVELS = "*:WARN"
APP_LOG_MAX_MIB = "32"
LIBCAMERA_LOG_MAX_MIB = "64"
LOG_GUARD_INTERVAL_SECS = "60"
LOG_GUARD_HEADROOM_BYTES = "262144"
LOG_TRUNCATION_HEADER = "[helios] log truncated because it exceeded configured limit"
LOG_FOLDER = "/var/log/helios"
MALLOC_ARENA_MAX = "2"
MALLOC_MMAP_THRESHOLD_ = "131072"
MALLOC_TRIM_THRESHOLD_ = "262144"
HELIOS_API__SERVER__BIND = "0.0.0.0:5801"
HELIOS_API__GRPC__BIND = "0.0.0.0:5802"
HELIOS_API__METRICS__BIND = "0.0.0.0:5803"
METRICS_BIND_ADDR = "0.0.0.0:5803"
LD_LIBRARY_PATH = "/usr/lib/edgetpu:/usr/lib"

[sets.helios-engine]
ENGINE_METRICS_ADDR = "0.0.0.0:5804"
LOG_FOLDER = "/var/log/helios"
MALLOC_ARENA_MAX = "2"
MALLOC_MMAP_THRESHOLD_ = "131072"
MALLOC_TRIM_THRESHOLD_ = "262144"
LD_LIBRARY_PATH = "/usr/lib/edgetpu:/usr/lib"
HELIOS_CAPTURE_STALL_MS = "6000"
HELIOS_CAPTURE_ACTIVE_STALL_MS = "5000"

[sets.helios-usb-recoveryd]
HELIOS_USB_RECOVERY_PORTS = "/dev/ttyGS0,/dev/ttyGS1"
HELIOS_USB_RECOVERY_BAUD = "115200"
HELIOS_USB_RECOVERY_STAGING_DIR = "/var/lib/helios/usb-recovery"
HELIOS_USB_RECOVERY_REBOOT_NORMAL_CMD = "systemctl reboot"

[sets.helios-peripherals]
IMU_ANGLE_RANGE = "+-180"
IMU_UPDATE_INTERVAL_MS = "5"
ICM_GYRO_RANGE_DPS = "2000"
ICM_ACCEL_RANGE_G = "16"
IMU_FUSION = "madgwick"
IMU_FRAME_CORRECTION_WXYZ = "0.004166289,-0.97154006,0.23672845,-0.007224368"
IMU_MOUNT_CORRECTION_WXYZ = "0.67425072,0.16264445,0.70176886,0.16264445"

[sets.helios-boot-buttond]
HELIOS_BOOT_BUTTON_RESET_CMD = "/usr/local/bin/helios-network-reset.sh"
HELIOS_BOOT_BUTTON_KEYS = "KEY_RESTART,KEY_CONFIG,KEY_POWER"
HELIOS_BOOT_BUTTON_HOLD_SECS = "5"
HELIOS_BOOT_BUTTON_COOLDOWN_SECS = "15"
LOG_FOLDER = "/var/log/helios"

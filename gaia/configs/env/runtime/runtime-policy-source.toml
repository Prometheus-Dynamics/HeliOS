[profiles.allocator_default]
MALLOC_ARENA_MAX = "1"
MALLOC_MMAP_THRESHOLD_ = "65536"
MALLOC_TRIM_THRESHOLD_ = "65536"
MALLOC_TOP_PAD_ = "65536"

[profiles.allocator_peripherals]
MALLOC_ARENA_MAX = "2"
MALLOC_TRIM_THRESHOLD_ = "131072"

[services."helios-api"]
profiles = ["allocator_default"]

[services."helios-api".env]
RUST_MIN_STACK = "1048576"

[services."helios-api".tokio.worker_threads]
env = "HELIOS_API_WORKER_THREADS"
default = 2
min = 1
max = 8

[services."helios-api".tokio.max_blocking_threads]
env = "HELIOS_API_MAX_BLOCKING_THREADS"
default = 4
min = 1
max = 32

[services."helios-api".tokio.thread_stack_bytes]
env = "HELIOS_API_THREAD_STACK_BYTES"
default = 1048576
min = 262144
max = 8388608

[services."helios-api".tokio.blocking_keep_alive_ms]
env = "HELIOS_API_BLOCKING_KEEP_ALIVE_MS"
default = 500
min = 100
max = 60000

[services."helios-engine"]
profiles = ["allocator_default"]

[services."helios-engine".env]
RAYON_NUM_THREADS = "4"
RUST_MIN_STACK = "2097152"

[services."helios-engine".tokio.worker_threads]
env = "HELIOS_ENGINE_WORKER_THREADS"
default = 4
min = 1
max = 4

[services."helios-engine".tokio.max_blocking_threads]
env = "HELIOS_ENGINE_MAX_BLOCKING_THREADS"
default = 4
min = 1
max = 16

[services."helios-engine".tokio.thread_stack_bytes]
env = "HELIOS_ENGINE_THREAD_STACK_BYTES"
default = 2097152
min = 262144
max = 8388608

[services."helios-engine".tokio.blocking_keep_alive_ms]
env = "HELIOS_ENGINE_BLOCKING_KEEP_ALIVE_MS"
default = 3000
min = 250
max = 60000

[services."helios-peripherals"]
profiles = ["allocator_peripherals"]

[services."helios-peripherals".tokio.worker_threads]
env = "HELIOS_PERIPHERALS_WORKER_THREADS"
default = 1
min = 1
max = 4

[services."helios-peripherals".tokio.max_blocking_threads]
env = "HELIOS_PERIPHERALS_MAX_BLOCKING_THREADS"
default = 1
min = 1
max = 16

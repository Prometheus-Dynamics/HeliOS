# Build definition: HeliOS for Raspberry Pi CM5.
imports = [
  "../workspace/base.toml",
  "../distros/helios/squashfs.toml",
  "../platforms/pi/cm5.toml",
]

[build]
version = "v2026.1.0"

[buildroot]
# Final copied images directory.
collect_out_dir = "output/HeliOS-cm5/{version}/images"
# Archive only the deployable disk image (sdcard.img), not all image artifacts.
archive_mode = "image"
# Archive base name (extension comes from buildroot.archive_format).
archive_name = "HeliOS-cm5-{version}-sdcard"

config = 3
gaia_version = ">=2.0.1-dev"
build_name = "helios-${input.profile}-raze"
version = "2026.2.0-dev.${project.commit_count}+${project.commit_short}"
description = "HeliOS image for the Raze (CM5 + OV9782). Use the profile input to switch between base OS and full appliance builds."
profile = "${input.profile}"
# Set here (not only in targets/raze.toml): `when = { target = ... }` imports
# are matched against the build entrypoint's metadata.
target = "raze"

# Device support (kernel, OV9782 driver, libcamera/libpisp, boot overlays, fan,
# LED ring, USB gadget, identity endpoint, SSH keys from the boot partition,
# hardware watchdog, the A/B update writer) comes from the Raze device package
# in Atlas (devices/raze), and orion-node from Orion's own Gaia layer. HeliOS layers are
# imported after both, so they override their defaults. Local development
# against checkouts:
#   --set sources.atlas.path=$PWD/../Atlas-Hardware-Manager
#   --set sources.orion.path=$PWD/../Orion
#   --set sources.lemnos.path=$PWD/../lemnos
imports = [
  "../layers/base-os.toml",
  { source = "atlas", path = "devices/raze/gaia/device.toml", when = { target = "raze" } },
  # lemnosd and lemnos-ctl (imported by the device layer from the `lemnos`
  # source) built on the build host instead of in Docker: static aarch64 musl
  # binaries, the same as the Docker build. The host needs
  # `rustup target add aarch64-unknown-linux-musl --toolchain 1.99.0` once.
  { source = "lemnos", path = "packaging/gaia/lemnosd-host.toml", when = { target = "raze" } },
  # Vulkan only (Mesa's v3dv, libdrm, the loader, vulkaninfo) for the CM5 GPU:
  # Daedalus's GPU path (wgpu with only its Vulkan backend, dmabuf import, fence
  # waits) needs nothing from Mesa's GL, so no EGL/GLES/GBM/libgallium (Atlas c1f7803:
  # .img.xz -3.1 MB, -18.5 MB unpacked). PhotonVision images keep gpu.toml.
  { source = "atlas", path = "devices/raze/gaia/gpu-vulkan.toml", when = { profile = "full" } },
  # Builds and installs orion-node and stages its unit, env file, sysusers
  # entry and preset. The app layer redeclares `orion-node-env` with HeliOS's
  # appliance settings; the release layer adds a drop-in for its state.
  { source = "orion", path = "packaging/gaia/orion-node.toml", when = { profile = "full" } },
  # orionctl, the operator CLI, as /usr/bin/orionctl (IPC only). orion-node
  # admits root (ORION_NODE_LOCAL_AUTH in HeliOS's orion-node.env), so it works
  # from a root shell.
  { source = "orion", path = "packaging/gaia/orionctl.toml", when = { profile = "full" } },
  { path = "../layers/app-layer.toml", when = { profile = "full" } },
  # Expected contents of a full image, in its own file so emptying a layer
  # can't also remove the check.
  { path = "../layers/expect-full.toml", when = { profile = "full" } },
  # Dynamic slots, the only Raze layout: the device package's slot initramfs (slot-init) and
  # slots fragment. The image is the first-flash <id>.img.xz (helios-<ver>-styx-<commit>.img.xz)
  # (signed by the signing layer), in outputs.dir; the root is a verity'd slot. The same .img.xz
  # updates a board (`slots stage-image`).
  { source = "atlas", path = "devices/raze/gaia/initramfs.toml", when = { profile = "full", target = "raze" } },
  { source = "atlas", path = "devices/raze/gaia/slots.toml", when = { profile = "full", target = "raze" } },
  { path = "../layers/release-layer.toml", when = { profile = "full" } },
  "../layers/signing.toml",
  "../targets/raze.toml",
  # A registry build cache (OCI checkpoints): pull what another machine built, push what this
  # one builds. Off unless asked for (`--set input.cache=local`): ops/registry-local.toml.
  { path = "../ops/registry-local.toml", when = { input = { cache = "local" } } },
  # The QEMU variant (-M virt) of the full image, imported last so it overrides the board: the
  # Raze kernel with its qemu fragment, Lemnos and Styx in sim mode, and USB_GADGET_ENABLED=0.
  # Never a board image (the slot id carries -qemu): `tools/build-os.sh raze full --machine qemu`.
  { path = "../layers/qemu-sim.toml", when = { profile = "full", input = { machine = "qemu" } } },
]

# Raze board package, pinned at b2b50fa (Atlas dev): BR2_RAZE_KERNEL_QEMU and qemu.config (the
# simulated board, b2b50fa), and the QEMU trial boots (3f9402a, atlas.tryboot and tryboot.req). Earlier pin 71bc3e3 (Atlas dev eadcf7c: every Atlas Settings action enrolled keyless while security is off (72b998b); 53b45c4: keyless Orion enrollment while security is off (53b45c4), slots-tryboot pull installs; af8ea62: installer LED states on the ring (a90012a), a 2 minute USB lease so the robot-network route arrives within a minute (af8ea62), failed downloads name the URL and answer (8de79b5); 18a5f6a: /usr/share/board/raze/camera.toml says the camera module's lens (fisheye, equidistant) and one module's full fit as a self-calibration prior; e058d25: the boot FAT gets every overlay and the slot README in both the root and slots/<id>/overlays/ (e058d25; c405cbb had put the README only in the bundle), the slots writer refuses a bundle missing an overlay (862c414), and every build runs check-boot-overlays.sh as a Gaia assembly check (needs Gaia f5aa011+). Earlier, e8b2833: A/B updater fixes from hardware, the Lemnos pin
# (8e59039 in the device package), board events numbered by seq (continuing after a torn log
# line), board-stream (the push channel on TCP 5898 with the hardware
# topic; device.toml imports it, and expect-full.toml lists its artifact and install), the
# board-agent null fix and clock sync. Earlier, e8b4ee0 (same contents without the two items above) and e565dcf: hat_map.dtb in images/rpi-firmware/overlays, lemnos-orion enabled (lemnosd devices as Orion
# resources), Orion 4fadba9, one Orion node id, orion:* may set the fan, the board hardware
# snapshot in /status; since 934f538: Orion `clock.set`, the eased
# LED blink, honest failed units, libcamera without libyuv/jpeg/bzip2 (HeliOS selects
# BR2_PACKAGE_JPEG, BR2_PACKAGE_LIBYUV and BR2_PACKAGE_BZIP2 itself in
# hardware/vision-media.toml), uncompressed modules, no KVM, the trimmed kernel
# (330 modules) with the config guard that respects package fixups.
# Earlier, 934f538: Lemnos cca50f7, with the `lemnos`
# user created at build time from Lemnos's own Buildroot users table through
# the device package (BR2_RAZE_LEMNOS_USERS_TABLE, quoted so olddefconfig keeps
# it; HeliOS keeps no copy), the
# self-test's chip-id reads brokered through lemnosd, and no free GPIO line,
# PWM channel or spidev named in the board definition; lemnosd owns the LED
# ring, fan and sensors, with the fan released back to the kernel governor
# while lemnosd runs and self-test LEDs on the test layer; its layers ask for
# Gaia >=2.0.0; board-agent, the Orion device agent, as a Gaia artifact
# (static aarch64 musl, built in Docker; BR2_PACKAGE_BOARD_AGENT is gone, and
# HeliOS never set it), with an orion-node
# drop-in setting ORION_NODE_LOCAL_AUTH_ALLOW=root (HeliOS sets no allow-list
# of its own, so that drop-in stands); the device machinery named board-*;
# network discovery keeps _pd-device._tcp and /.well-known/pd-device): EROFS,
# 4 KiB pages, updater safety nets, Bootlin bleeding-edge toolchain, kernel 7.2
# with the Raze trims and a built-in EROFS (LZMA, ZSTD), firmware 1.20260915,
# Atlas dev ff07b83: the Raze package on Lemnos 01939e9; earlier 015f9c8 (b1e5823 within the file-size lint): discovery keeps a board's full report when a later identity fetch times out (host CLI; no board change); 638fa65: an explicit slots rollback ends as rolled-back on the next boot (it stayed "rebooting" with a stale error); d7a2e9e: a slots trial runs the trial checks (slot_sanity: modules, USB gadget bound, no failed critical unit) before it is kept, and an update through Orion asks the node for the 60 s Atlas waits; earlier 61c3639: the Raze package on Lemnos 2610455 (manifest gaia_import, lemnos-ipc); earlier d9064302: one resident board-http.service answers /.well-known/pd-device (no
# per-connection unit: ~2.5 s per request under QEMU before); earlier b2b50fa: the QEMU kernel
# fragment, slot-init on virtio disks, one-shot sweeps wait; 71bc3e3: slots stage-image installs the .img.xz on the board (device lock, a refusal
# leaves the state), pre-reboot hook, signer display; earlier 20cd0c4: the IMU at 200 Hz on the PIO bus (2.9 % of a core measured); earlier 3c62ba1: the Raze Gaia layers on config v3; earlier 28437aa: services started by .path units are never rate-limited (board-identity-refresh); earlier 5d4749e: the board support bundle gzips without tar -z (BusyBox) and fails loudly; earlier b285300: an unhealthy trial's reason survives the restart back; earlier 3e350dd: board-agent update installs an upload in place (file:///data/updates/, slots stage-url); 7f395e1 slot-init dispatches merge-layers (layered slots install) and reads Gaia's layers.json size/erofs_size; earlier 022013d: 79389f3 usb-gadget-watch probes every 5 s (a link stall costs ~15 s), skips a suspended link; e791c2c: the ttyGS gettys no longer reset or hang up their tty at shutdown (an unread gadget port blocked PID 1 until the hardware watchdog reset the board mid-shutdown); c405cbb: overlays/README in every slot so a slot boots its own overlays; 307d746: USB gadget watchdog with stall evidence (8176035, 9313f82), slot display_name (c612f53), last boots and kept kernel logs over Orion (facecb9); a36e866: proven kernel (trim opt-in via BR2_RAZE_KERNEL_TRIM), zstd slot initramfs; a9e23df: slot /init persists its logs; 25a02d7: initramfs guard, trial failure reasons; 15d5a11: slot /init refuses cut-short images, lean slot initramfs (73075a5); f3a5367: slot-init as the initramfs /init; 2203c3b: lean firmware overlays (only what the board loads), smaller slot-init; 2bf3dfb: kernel release from /proc in the slot /init; 79ac2f9: slot-init finds partitions itself; f393e9f: slot initramfs mounts /proc /sys /dev with a console, logs failures to p1; 2aadd1c: e2fsck with its libraries in the slot initramfs; 01f6d10: slot /init and lib.sh fixes for slots boards; b4d664a: board-data-owners (re-owns service state on /data at boot), on top of the
# slot-management and live-stream work.
# libcamera 0.7.2, the A/B update writer (/usr/lib/board/update,
# board-image-slots) for the same .img.xz that is flashed,
# read-only-root-safe device services, no udev hwdb, optional Vulkan layer.
# Atlas 034663e (2026-11-03): the Raze package ships Lemnos's system looks as
# /etc/lemnos/looks.d/system.toml and the ring's default_look, for Lemnos 50533a8
# (only status.* built in). It must move together with the Lemnos source below.
# Atlas 6a727fe (2026-11-03): the slots image is sized to its content (boot
# FAT auto + 64M free, data 8M free; /data grows on first boot).
# Atlas 4c448ec: r8152's rtl_nic firmware ships from the device package (needs Gaia cf62b48+).
# Atlas 48aba15: in-tree modules shadowed by Styx's updates/ modules are dropped (Gaia f90bed4+).
# Atlas b4de2e1: slots stage-url installs an uploaded .img.xz (the only update image); the
# management-link rollback watch no longer holds up boot completion.
# Atlas f351316: the trial confirm is event-driven and outside the boot transaction.
# Atlas c1f7803: gpu-vulkan.toml stands alone (Vulkan without Mesa's GL); also f07b56e
# (no usb-boot in Orion's auto-enroll), 20366e4 (board-stream's hardware topic goes).
# Atlas fa0cac3: device package on Lemnos cf3a4ac (lemnosd SCHED_FIFO IMU loop: 0 of 12000
# samples lost at 200 Hz under load on Raze #1, against 80 on dev.931; 0660 lemnos socket),
# trial-only --boot, every restart path through reboot-locked (holds raze-gpu.lock),
# gaia_version >=2.0.2 on the layers that need it.
# Atlas 380c375: no device-package change since fa0cac3 (gateway slot install/remove fixes
# and UI only); pinned so the image and the host tools name the same Atlas.
[[sources]]
id = "atlas"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager.git"
rev = "380c375aa96c9119348fc308ffda668af5474706"

# Lemnos (dev f803975: earlier 49f8dce: board ownership and the SystemCore board, lemnos-ctl in its own crate; earlier b87f76c: the public surface trimmed, RegisterResult and MAX_BURST kept for Styx; so HeliOS builds only against what Lemnos exports; earlier f3c022b: soft spots in looks and live input updates, for HeliOS's LED director; earlier 384b2b1: the lemnos user at fixed uid 900 for the shared /data; 026abcd: lemnos-orion
# on Orion protocol 5, matching orion-node; before it ce3dda3; earlier 8e59039: subscribe
# replies return the granted period, boot-clock timestamps and the deadline scheduler; earlier b2634fc: fault reasons and lemnosd's Orion bridge, `lemnos-orion`).
# The Raze layer imports Lemnos's lemnosd layer from a
# source named `lemnos`, and Gaia lets only local files declare import
# sources, so it is declared here, at the commit the Atlas package is tested
# with (Atlas devices/README.md; capabilities.hardware-service.gaia_import.rev
# in the Raze manifest): raw GPIO, PWM, I2C and SPI access through lemnosd,
# writes and claims that end with the client's connection, and the Buildroot
# users table for the `lemnos` user (packaging fixes: Gaia >=2.0.0, one cargo
# build group for lemnosd and lemnos-ctl, the host-build layer imported
# above). backend/Cargo.lock pins the same commit for lemnos-ipc, the lemnosd
# client helios-peripherals uses. Lemnos dev 01939e9: also Daedalus's lock and
# Atlas ff07b83's manifest gaia_import. Lemnos 50533a8 (2026-11-03): built-in looks
# are status.* only, the named looks are look files (the Atlas pin above stages
# the system set), removed light keys are refused; Atlas 034663e's gaia_import.
# backend/Cargo.lock keeps lemnos-ipc at 01939e9 until the next library pin
# round (lemnos-ipc's wire is unchanged between the two).
# Lemnos cf3a4ac (2026-11-06, Lemnos's settled set): the CMA heap capped by CmaTotal,
# DmaHeap::allocate_importable, IPC gap fixes on protocol 1, the 0660 lemnos:lemnos socket.
# Board-tested with Atlas fa0cac3 (all six lemnosd clients connect). backend/Cargo.lock's
# lemnos-ipc moves in the joint Daedalus/Styx/Lemnos lock bump (protocol 1 unchanged).
# Lemnos 80d5d1e (2026-11-06, the joint round): lemnosd's GPU lease (`lemnos-ctl gpu run`),
# the 0-alloc steady state, read ids (FEATURE_READ_ID) and each light's current owner after
# the welcome; backend/Cargo.lock's lemnos-ipc moves to the same commit in this round.
[[sources]]
id = "lemnos"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Lemnos.git"
rev = "80d5d1e67972c5f6ff4ffae944fb6fa6e090c76e"

# Orion dev 1996c47 (protocol 1, the backend/Cargo.toml pin; PEER_AUTO_TRUST is off or private-link). Earlier, 0703507 (Gaia config v3 packaging layers; code as 6a70758: one malloc arena with 64 KiB trim thresholds in its unit: 13.6 -> 8.4 MiB PSS on the CM5; lazy watcher snapshots; 9ad7991: the safe-mode unit is never enabled; earlier a380034: safe mode and its metric, robot-link peer trust in open mode, watches that resume after node restarts, retraction of a removed provider's observed records; ). Earlier, Orion protocol 5 (live-streams 414834b: the orion user at fixed uid 901; f8d767ac: push sessions, streams with history and backfill,
# open read and USB auto-enroll; the same commit as the PhotonVision Raze images' orion-node).
# Earlier, v4 (main f3efb26: adds the orion-nt4 crate, which HeliOS does not depend on yet; earlier
# 4fadba9: request/response resource actions (`ActionRequest.wait_ms`,
# `ActionCaller`), a wire change, so every Orion consumer moves together. Earlier, 973ced7: CI and test fixes on 4a6945a's wire; the node stops its systemd watchdog before
# STOPPING=1; TypedConfigValue::F64 (ec91d0a), observed-state watch, session
# resume on reconnect, CPU and temperature host metrics, operator access,
# orionctl layer). Must be the commit backend/Cargo.lock pins for the `orion`
# crate: orion-node, orionctl and the HeliOS services speak the same control
# protocol, and its layout changed within v4.
[[sources]]
id = "orion"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Orion.git"
rev = "1996c47ef4f240efdc5c83165e9e273f159cbbd5"

# The slot identity for the slots fragment: helios-<version>-<variant>-<commit>.
[inputs.slot_family]
kind = "string"
default = "helios"

[inputs.slot_version]
kind = "string"
default = "2026.2.0"

[inputs.slot_variant]
kind = "string"
default = "styx"

# The name Atlas shows for this slot (slot.json "display_name", Atlas c612f53).
[inputs.slot_display_name]
kind = "string"
default = "HeliOS"

# The HeliOS commit: tools/build-os.sh passes it (--set input.slot_commit / slot_source),
# since project tokens don't resolve in input defaults.
[inputs.slot_commit]
kind = "string"
default = "00000000"

[inputs.slot_source]
kind = "string"
default = "unknown"

[inputs.slot_data_dir]
kind = "string"
default = "helios"

[inputs.slot_cmdline]
kind = "string"
default = "console=serial0,115200 console=tty1 rootwait log_buf_len=8M printk.devkmsg=on"

# The cargo profile of the backend binaries: "release" (fat LTO, what ships and what timings
# are measured on) or "dev-image" (thin LTO, faster relinks for quick device iterations).
[inputs.cargo_profile]
kind = "enum"
default = "release"
choices = ["release", "dev-image"]

# The registry build cache: "off" (default) or "local", the test registry on 127.0.0.1:5000
# (gaia/configs/ops/registry-local.toml).
[inputs.cache]
kind = "enum"
default = "off"
choices = ["off", "local"]

# The machine the image is for: the Raze board (default) or the QEMU variant of it (-M virt, the
# simulated board; gaia/configs/layers/qemu-sim.toml). Set by tools/build-os.sh --machine qemu.
[inputs.machine]
description = "Machine: board (the Raze) or qemu (the simulated board under -M virt, never a board image)"
kind = "enum"
default = "board"
choices = ["board", "qemu"]

[inputs.profile]
description = "Build profile"
kind = "enum"
default = "full"
choices = ["base-os", "full"]

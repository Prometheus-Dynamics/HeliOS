description = "Shared squashfs storage mode for the bare appliance OS."

[image]
kind = "buildroot"
config_overrides = [
  ["BR2_TARGET_ROOTFS_EXT2", "n"],
  ["BR2_TARGET_ROOTFS_SQUASHFS", "y"],
  ["BR2_TARGET_ROOTFS_SQUASHFS4_XZ", "y"],
  ["BR2_TARGET_ROOTFS_SQUASHFS_BS_1024K", "y"],
  ["BR2_TARGET_ROOTFS_SQUASHFS_EXTREME_COMP", "y"],
]

[[image.expected_images]]
name = "rootfs.squashfs"
format = "squashfs"
required = true

[image.output]
# Keep provider work/output collection isolated per build, but place release
# compressed raw disk images in a repo-level output folder for flashing/distribution.
archive_name = "${project.root_dir}/output/${build.name}-${build.version}.img.xz"

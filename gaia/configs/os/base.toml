description = "Shared base OS layer: Buildroot source, init system, and the core package baseline."

[[sources]]
id = "buildroot-source"
kind = "git"
repo = "https://github.com/buildroot/buildroot"
tag = "2025.11.3"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot-source"
# external_tree is set by targets/raze.toml: it must list the device package's
# tree as well, after the device layer is imported.
config_overrides = [
  ["BR2_INIT_SYSTEMD", "y"],
  ["BR2_INIT_BUSYBOX", "n"],
  ["BR2_INIT_NONE", "n"],
  # HeliOS names its devices itself; a stock hostname would let the device
  # package apply raze-{serial8}. The full profile also stages /etc/hostname.
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"helios\""],
  ["BR2_TARGET_ENABLE_ROOT_LOGIN", "y"],
  ["BR2_TARGET_GENERIC_ROOT_PASSWD", "\"root\""],
  ["BR2_PACKAGE_BASH", "y"],
  ["BR2_PACKAGE_BUSYBOX_SHOW_OTHERS", "y"],
  ["BR2_PACKAGE_CA_CERTIFICATES", "y"],
  # e2fsck, mke2fs and tune2fs are always built; resize2fs is optional.
  ["BR2_PACKAGE_E2FSPROGS", "y"],
  ["BR2_PACKAGE_E2FSPROGS_RESIZE2FS", "y"],
  ["BR2_PACKAGE_LINUX_FIRMWARE", "y"],
  ["BR2_PACKAGE_OPENSSH", "y"],
  ["BR2_PACKAGE_PARTED", "y"],
  ["BR2_PACKAGE_UTIL_LINUX", "y"],
  ["BR2_PACKAGE_UTIL_LINUX_BINARIES", "y"],
]

[image.output]
collect_dir = "gaia/output/${build.name}/images"
emit_report = true

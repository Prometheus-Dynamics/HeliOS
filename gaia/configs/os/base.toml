description = "Shared base OS layer: Buildroot source, init system, and the core package baseline."

[[sources]]
id = "buildroot-source"
kind = "git"
repo = "https://github.com/buildroot/buildroot"
tag = "2025.11.3"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot-source"
external_tree = "gaia/assets/buildroot"
external_tree_mode = "required"
config_overrides = [
  ["BR2_INIT_SYSTEMD", "y"],
  ["BR2_INIT_BUSYBOX", "n"],
  ["BR2_INIT_NONE", "n"],
  ["BR2_TARGET_ENABLE_ROOT_LOGIN", "y"],
  ["BR2_TARGET_GENERIC_ROOT_PASSWD", "\"root\""],
  ["BR2_PACKAGE_BASH", "y"],
  ["BR2_PACKAGE_BUSYBOX_SHOW_OTHERS", "y"],
  ["BR2_PACKAGE_CA_CERTIFICATES", "y"],
  ["BR2_PACKAGE_E2FSPROGS", "y"],
  ["BR2_PACKAGE_E2FSPROGS_E2FSCK", "y"],
  ["BR2_PACKAGE_E2FSPROGS_MKE2FS", "y"],
  ["BR2_PACKAGE_E2FSPROGS_RESIZE2FS", "y"],
  ["BR2_PACKAGE_E2FSPROGS_TUNE2FS", "y"],
  ["BR2_PACKAGE_LINUX_FIRMWARE", "y"],
  ["BR2_PACKAGE_OPENSSH", "y"],
  ["BR2_PACKAGE_PARTED", "y"],
  ["BR2_PACKAGE_UTIL_LINUX", "y"],
  ["BR2_PACKAGE_UTIL_LINUX_BINARIES", "y"],
]

[image.output]
collect_dir = "gaia/output/${build.name}/images"
emit_report = true

description = "Shared base OS layer: Buildroot source, init system, and the core package baseline."

[[sources]]
id = "buildroot-source"
kind = "git"
repo = "https://github.com/buildroot/buildroot"
tag = "2026.08"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot-source"
# external_tree is set by targets/raze.toml: it must list the device package's
# tree as well, after the device layer is imported.
config_overrides = [
  ["BR2_INIT_SYSTEMD", "y"],
  ["BR2_INIT_BUSYBOX", "n"],
  ["BR2_INIT_NONE", "n"],
  # No static hostname (no /etc/hostname): the device package applies
  # helios-{serial8} at boot (/etc/board/hostname.env, os/storage/erofs.toml).
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"\""],
  ["BR2_TARGET_ENABLE_ROOT_LOGIN", "y"],
  ["BR2_TARGET_GENERIC_ROOT_PASSWD", "\"root\""],
  ["BR2_PACKAGE_BASH", "y"],
  ["BR2_PACKAGE_BUSYBOX_SHOW_OTHERS", "y"],
  ["BR2_PACKAGE_CA_CERTIFICATES", "y"],
  # e2fsck, mke2fs and tune2fs are always built; resize2fs is optional.
  ["BR2_PACKAGE_E2FSPROGS", "y"],
  ["BR2_PACKAGE_E2FSPROGS_RESIZE2FS", "y"],
  # No linux-firmware: it was selected with no blob, so it only cost a
  # download and extract per build. The Raze needs none: Wi-Fi and Bluetooth
  # are off (disable-wifi-pi5, disable-bt-pi5 in config.txt), networking is
  # Ethernet and the USB gadget, the OV9782 has no firmware, and the VPU
  # firmware comes from rpi-firmware. Select only the blob if one is needed.
  ["BR2_PACKAGE_OPENSSH", "y"],
  ["BR2_PACKAGE_PARTED", "y"],
  ["BR2_PACKAGE_UTIL_LINUX", "y"],
  ["BR2_PACKAGE_UTIL_LINUX_BINARIES", "y"],
  # systemd-sysusers (Atlas devices/README.md: lemnosd needs it, Lemnos
  # packaging/README.md). On the read-only root it only checks at boot that
  # the sysusers.d entries exist; the users are created at build time from
  # Buildroot users tables (Buildroot does not run sysusers into the target):
  # lemnosd's `lemnos` user from Lemnos's own table, which the device package
  # adds (Atlas's lemnos.toml, BR2_RAZE_LEMNOS_USERS_TABLE; HeliOS keeps no
  # copy: two copies make mkusers fail), and in the full profile Orion's
  # (runtime-services/backend-core.toml).
  ["BR2_PACKAGE_SYSTEMD_SYSUSERS", "y"],
]

[image.output]
collect_dir = "gaia/output/${build.name}/images"
emit_report = true

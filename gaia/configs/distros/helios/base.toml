# Distro/profile: Helios, composed on top of generic Gaia modules.

[buildroot]
imports = [
  "../../modules/buildroot/base.toml",
  "../../modules/buildroot/helios_packages.toml",
]

  [buildroot.package_versions]
  imports = [
    "../../modules/buildroot/package_versions.toml",
  ]

[program]
imports = [
  "../../modules/program/base.toml",
  "../../modules/program/rust.toml",
  "../../modules/program/java.toml",
  "../../modules/program/custom.toml",
]
check_policy = "warn"

  [program.lint]
  imports = [
    "../../modules/program/lint.toml",
  ]
  enabled = false

  [program.install]
  imports = [
    "../../modules/program/install.toml",
  ]

[stage]
imports = [
  "../../modules/stage/base.toml",
  "../../modules/stage/system.toml",
]

  [stage.env]
  imports = [
    "../../env/runtime/helios.toml",
  ]

  [stage.services]
  imports = [
    "../../modules/stage/services/base.toml",
    "../../modules/stage/services/provisioning.toml",
    "../../modules/stage/services/networkd.toml",
    "../../modules/stage/services/ssh.toml",
    "../../modules/stage/services/login_banner.toml",
    "../../modules/stage/services/runtime/helios-engine.toml",
    "../../modules/stage/services/runtime/helios-updater.toml",
    "../../modules/stage/services/runtime/helios-usb-recoveryd.toml",
    "../../modules/stage/services/runtime/helios-boot-buttond.toml",
    "../../modules/stage/services/runtime/helios-peripherals.toml",
    "../../modules/stage/services/runtime/helios-fan-overlays.toml",
    "../../modules/stage/services/runtime/helios-os-self-check.toml",
    "../../modules/stage/services/runtime/helios-api.toml",
    "../../modules/stage/services/runtime/helios-ide.toml",
    "../../modules/stage/services/runtime/helios-diagnostics.toml",
    "../../modules/stage/services/runtime/helios-frontend.toml",
    "../../modules/stage/services/runtime/helios-set-governor.toml",
    "../../modules/stage/services/runtime/helios-set-build-time.toml",
    "../../modules/stage/services/runtime/helios-journal-vacuum.toml",
    "../../modules/stage/services/runtime/helios-ota-confirm.toml",
    "../../modules/stage/services/gadget.toml",
    "../../modules/stage/services/usb_power.toml",
  ]

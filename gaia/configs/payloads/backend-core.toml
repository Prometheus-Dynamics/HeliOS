description = "Backend-core payload layer: the HeliOS services and tools built from the backend workspace (Daedalus, Styx, Eidos, Orion and Lemnos as git dependencies pinned by backend/Cargo.lock). orionctl comes from Orion's own Gaia layer (packaging/gaia/orionctl.toml)."

[providers.rust]
allow_nested_build = true
timeout_seconds = 7200

[[sources]]
id = "backend-workspace"
kind = "path"
path = "backend"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

[[artifacts]]
id = "helios-api"
kind = "rust"
package = "helios-api"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-api"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-api"
output_path = "gaia/output/${build.name}/artifacts/helios-api"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-engine"
kind = "rust"
package = "helios-engine"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-engine"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-engine"
output_path = "gaia/output/${build.name}/artifacts/helios-engine"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-diagnostics"
kind = "rust"
package = "helios-diagnostics"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-diagnostics"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-diagnostics"
output_path = "gaia/output/${build.name}/artifacts/helios-diagnostics"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

# The vision nodes as a Daedalus dynamic plugin: Eidos's own plugin
# (eidos_daedalus::EidosPlugin), exported by the one-line leaf cdylib
# helios-eidos-plugin, which helios-engine loads from
# /usr/lib/helios/plugins/daedalus at startup.
#
# The engine installs it on the Rust-ABI path only when both were built with
# the same Daedalus build fingerprint and the same Rust types behind the
# boundary type keys (styx:framelease). Gaia builds artifacts with different
# feature flags in separate cargo invocations, so check the engine log for the
# install path after a build (see TODO.md).
[[artifacts]]
id = "helios-eidos-plugin"
kind = "rust"
package = "helios-eidos-plugin"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
target = "aarch64-unknown-linux-gnu"
profile = "release"
target_name = "libhelios_eidos_plugin.so"
install_name = "libhelios_eidos_plugin.so"
install_class = "library"
install_dest_hint = "/usr/lib/helios/plugins/daedalus/libhelios_eidos_plugin.so"
output_path = "gaia/output/${build.name}/artifacts/libhelios_eidos_plugin.so"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[install]]
id = "install-helios-api"
artifact = "helios-api"
dest = "/usr/bin/helios-api"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-engine"
artifact = "helios-engine"
dest = "/usr/bin/helios-engine"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-diagnostics"
artifact = "helios-diagnostics"
dest = "/usr/bin/helios-diagnostics"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-eidos-plugin"
artifact = "helios-eidos-plugin"
dest = "/usr/lib/helios/plugins/daedalus/libhelios_eidos_plugin.so"
replace = true
mode = 420
owner = "root"
group = "root"

[image]
kind = "buildroot"

[image.feed]
install_entries = [
  "install-helios-api",
  "install-helios-engine",
  "install-helios-diagnostics",
  "install-helios-eidos-plugin",
]

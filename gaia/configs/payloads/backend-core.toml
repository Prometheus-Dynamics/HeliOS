config = 3
description = "Backend-core payload layer: the HeliOS services and tools built from the backend workspace (Daedalus, Styx, Eidos, Orion and Lemnos as git dependencies pinned by backend/Cargo.lock). orionctl comes from Orion's own Gaia layer (packaging/gaia/orionctl.toml)."

[providers.rust]
allow_nested_build = true
timeout_seconds = 7200

[[sources]]
id = "backend-workspace"
kind = "path"
path = "backend"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

# Eidos, a private repository: Gaia fetches it on the host (with the host's
# credentials) and serves the commit backend/Cargo.lock pins to cargo from its
# mirror, so the build container needs no credentials.
[[sources]]
id = "eidos"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Eidos.git"
branch = "dev"

[[artifacts]]
id = "helios-api"
kind = "rust"
package = "helios-api"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
# Eidos is private: cargo resolves its locked commit from the host-fetched eidos source.
cargo_git_sources = { "https://github.com/Prometheus-Dynamics/Eidos.git" = "eidos" }
target = "aarch64-unknown-linux-gnu"
profile = "${input.cargo_profile}"
install_name = "helios-api"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-api"
output_path = "${outputs.dir}/artifacts/helios-api"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-engine"
kind = "rust"
package = "helios-engine"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
# Eidos is private: cargo resolves its locked commit from the host-fetched eidos source.
cargo_git_sources = { "https://github.com/Prometheus-Dynamics/Eidos.git" = "eidos" }
target = "aarch64-unknown-linux-gnu"
profile = "${input.cargo_profile}"
install_name = "helios-engine"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-engine"
output_path = "${outputs.dir}/artifacts/helios-engine"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-diagnostics"
kind = "rust"
package = "helios-diagnostics"
source = "backend-workspace"
# One cargo invocation for every backend package (Gaia build group), so shared
# crates resolve the same features in the engine and its plugins.
build_group = "helios-backend"
# Eidos is private: cargo resolves its locked commit from the host-fetched eidos source.
cargo_git_sources = { "https://github.com/Prometheus-Dynamics/Eidos.git" = "eidos" }
target = "aarch64-unknown-linux-gnu"
profile = "${input.cargo_profile}"
install_name = "helios-diagnostics"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-diagnostics"
output_path = "${outputs.dir}/artifacts/helios-diagnostics"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

# Eidos's Daedalus plugin (eidos_daedalus::EidosPlugin) is built into helios-engine (its
# `static-eidos` feature): no libhelios_eidos_plugin.so, so no second Daedalus runtime, std and
# serde in a library (2 MB of text, 3.5 MB of engine PSS on a Raze). HELIOS_ENGINE_BUILTIN_EIDOS=0
# loads a library from /usr/lib/helios/plugins/daedalus instead.

[[install]]
id = "install-helios-api"
artifact = "helios-api"
dest = "/usr/bin/helios-api"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-engine"
artifact = "helios-engine"
dest = "/usr/bin/helios-engine"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-diagnostics"
artifact = "helios-diagnostics"
dest = "/usr/bin/helios-diagnostics"
replace = true
mode = 493
owner = "root"
group = "root"

[image]
kind = "buildroot"

[image.feed]
install_entries = [
  "install-helios-api",
  "install-helios-engine",
  "install-helios-diagnostics",
]

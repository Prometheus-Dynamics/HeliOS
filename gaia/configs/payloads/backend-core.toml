description = "Backend-core payload layer: the HeliOS services and tools built from the backend workspace (Daedalus, Styx, Eidos, Orion and Lemnos as git dependencies pinned by backend/Cargo.lock), plus orionctl."

[providers.rust]
allow_nested_build = true
timeout_seconds = 7200

[[sources]]
id = "backend-workspace"
kind = "path"
path = "backend"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

[[artifacts]]
id = "helios-api"
kind = "rust"
package = "helios-api"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-api"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-api"
output_path = "gaia/output/${build.name}/artifacts/helios-api"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-engine"
kind = "rust"
package = "helios-engine"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-engine"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-engine"
output_path = "gaia/output/${build.name}/artifacts/helios-engine"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-updater"
kind = "rust"
package = "helios-updater"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-updater"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-updater"
output_path = "gaia/output/${build.name}/artifacts/helios-updater"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "helios-diagnostics"
kind = "rust"
package = "helios-diagnostics"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-diagnostics"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-diagnostics"
output_path = "gaia/output/${build.name}/artifacts/helios-diagnostics"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[artifacts]]
id = "heliosctl"
kind = "rust"
package = "heliosctl"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "heliosctl"
install_class = "binary"
install_dest_hint = "/usr/bin/heliosctl"
output_path = "gaia/output/${build.name}/artifacts/heliosctl"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

# orion-node itself comes from Orion's Gaia layer (packaging/gaia/orion-node.toml,
# imported by builds/raze.toml). Its layer has no orionctl, so the CLI is built
# here from the same pinned `orion` source, in Orion's own cross image.
[[artifacts]]
id = "orionctl"
kind = "rust"
package = "orionctl"
source = "orion"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "orionctl"
install_class = "binary"
install_dest_hint = "/usr/bin/orionctl"
output_path = "gaia/output/${build.name}/artifacts/orionctl"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "orion-aarch64-cross"
dockerfile = "@source:orion/packaging/gaia/docker/aarch64-cross.Dockerfile"
context = "@source:orion/packaging/gaia/docker"

[[artifacts]]
id = "helios-provision"
kind = "rust"
package = "helios-provision"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "helios-provision"
install_class = "binary"
install_dest_hint = "/usr/local/bin/helios-provision"
output_path = "gaia/output/${build.name}/artifacts/helios-provision"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross"
dockerfile = "gaia/docker/aarch64/Dockerfile.aarch64-rpi4"
context = "gaia/docker"

[[install]]
id = "install-helios-api"
artifact = "helios-api"
dest = "/usr/bin/helios-api"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-engine"
artifact = "helios-engine"
dest = "/usr/bin/helios-engine"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-updater"
artifact = "helios-updater"
dest = "/usr/bin/helios-updater"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-diagnostics"
artifact = "helios-diagnostics"
dest = "/usr/bin/helios-diagnostics"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-heliosctl"
artifact = "heliosctl"
dest = "/usr/bin/heliosctl"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-orionctl"
artifact = "orionctl"
dest = "/usr/bin/orionctl"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-provision"
artifact = "helios-provision"
dest = "/usr/local/bin/helios-provision"
replace = true
mode = 493
owner = "root"
group = "root"

[image]
kind = "buildroot"

[image.feed]
install_entries = [
  "install-helios-api",
  "install-helios-engine",
  "install-helios-updater",
  "install-helios-diagnostics",
  "install-heliosctl",
  "install-orionctl",
  "install-helios-provision",
]

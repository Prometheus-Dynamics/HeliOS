description = "Shared vision plugin payload layer: installs the Daedalus CV, AI, and NT4 runtime plugins."

[providers.rust]
allow_nested_build = true
timeout_seconds = 7200

[[sources]]
id = "backend-workspace"
kind = "path"
path = "backend"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

[[artifacts]]
id = "cv-plugin"
kind = "rust"
package = "cv-plugin"
target_name = "libcv_plugin.so"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "cv-plugin.so"
install_class = "library"
install_dest_hint = "/usr/lib/helios/plugins/daedalus/cv-plugin.so"
output_path = "gaia/output/${build.name}/artifacts/libcv_plugin.so"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross-rust194"

[[artifacts]]
id = "ai-plugin"
kind = "rust"
package = "ai-plugin"
target_name = "libai_plugin.so"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "ai-plugin.so"
install_class = "library"
install_dest_hint = "/usr/lib/helios/plugins/daedalus/ai-plugin.so"
output_path = "gaia/output/${build.name}/artifacts/libai_plugin.so"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross-rust194"

[[artifacts]]
id = "nt4-plugin"
kind = "rust"
package = "nt4-plugin"
target_name = "libnt4_plugin.so"
source = "backend-workspace"
target = "aarch64-unknown-linux-gnu"
profile = "release"
install_name = "nt4-plugin.so"
install_class = "library"
install_dest_hint = "/usr/lib/helios/plugins/daedalus/nt4-plugin.so"
output_path = "gaia/output/${build.name}/artifacts/libnt4_plugin.so"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "helios-cross-rust194"

[[install]]
id = "install-cv-plugin"
artifact = "cv-plugin"
dest = "/usr/lib/helios/plugins/daedalus/cv-plugin.so"
replace = true
mode = 420
owner = "root"
group = "root"

[[install]]
id = "install-ai-plugin"
artifact = "ai-plugin"
dest = "/usr/lib/helios/plugins/daedalus/ai-plugin.so"
replace = true
mode = 420
owner = "root"
group = "root"

[[install]]
id = "install-nt4-plugin"
artifact = "nt4-plugin"
dest = "/usr/lib/helios/plugins/daedalus/nt4-plugin.so"
replace = true
mode = 420
owner = "root"
group = "root"

[image]
kind = "buildroot"

[image.feed]
install_entries = [
  "install-cv-plugin",
  "install-ai-plugin",
  "install-nt4-plugin",
]

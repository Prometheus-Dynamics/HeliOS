config = 3
description = "UI payload layer: the HeliOS UI's static build (ui/, SvelteKit with adapter-static, built with bun by Gaia), served by helios-api on :5800 next to the API."

imports = ["./ui-build.toml"]

[[install]]
id = "install-helios-ui"
artifact = "helios-ui"
dest = "/usr/share/helios/ui"
replace = true

[image]
kind = "buildroot"

[image.feed]
install_entries = ["install-helios-ui"]

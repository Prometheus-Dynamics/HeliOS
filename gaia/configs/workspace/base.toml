[workspace]
root_dir = "."
build_dir = "gaia/build/${build.name}"
out_dir = "gaia/output/${build.name}"

[[workspace.named_paths]]
alias = "assets"
path = "gaia/assets"
kind = "host"

[reporting]
summary = true
provenance = true
manifest = true

[providers.git]
allow_remote_resolution = true
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
timeout_seconds = 1800

[providers.buildroot]
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
timeout_seconds = 14400
# Build speed (Gaia 2.5): top-level make with -j<nproc> over independent
# packages (per-package directories), and a compiler cache shared by every
# Buildroot tree of the user.
local_jobs = 0
parallel_packages = true
# Build the Buildroot tree in RAM (falls back to disk when memory is short):
# a full build is mostly small-file IO, which a spinning disk makes slow.
work_dir = "ram"

[providers.buildroot.package_cache]
enabled = true

[providers.buildroot.host_tools]
# The build image's ccache instead of building host-ccache and its libraries.
ccache = "system,build"

[providers.buildroot.ccache]
enabled = true
max_size = "50G"

[execution]
jobs = 0

[failure]
rollback_on_error = true
preserve_failed_outputs = true
rollback_domains = ["artifacts", "installs", "stage", "checkpoints"]
